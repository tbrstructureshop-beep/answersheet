<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IELTS Listening Practice Pro</title>
    <!-- Load YouTube Iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <!-- Load SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Load Mozilla PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --correct-bg: #dcfce7;
            --incorrect-bg: #fee2e2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        html, body { height: 100%; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; }
        .container { max-width: 800px; margin: 0 auto; padding: 0 16px; }

        /* --- STICKY TOP ZONE --- */
        .sticky-zone {
            flex-shrink: 0; background-color: var(--bg-color); padding-top: 10px; padding-bottom: 8px;
            border-bottom: 2px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); z-index: 100;
        }
        header h1 { text-align: center; font-size: 1.3rem; margin-bottom: 10px; }
        
        .top-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }

        /* Source Selector Tabs */
        .source-mode-tabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
        .tab-btn { background: #e2e8f0; color: #475569; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; }
        .tab-btn.active { background: var(--primary); color: white; }

        /* Mobile Layout Controller */
        .mobile-view-tabs { display: none; margin-bottom: 8px; background: #e2e8f0; padding: 3px; border-radius: 8px; gap: 4px; }
        .mobile-view-btn { flex: 1; background: transparent; color: var(--text-muted); font-size: 12px; font-weight: 600; padding: 6px 4px; border-radius: 6px; border: none; cursor: pointer; text-align: center; }
        .mobile-view-btn.active { background: var(--card-bg); color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

        /* --- SCROLLABLE WORKSPACE --- */
        .main-scroll-area { flex-grow: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: 15px; padding-bottom: 240px; }

        /* Persistent File Indicator Badges */
        .file-status-badge {
            display: none; font-size: 11px; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe;
            padding: 2px 6px; border-radius: 4px; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* --- RESPONSIVE DESKTOP SPLIT VIEW --- */
        @media (min-width: 992px) {
            body { flex-direction: row; }
            .sticky-zone {
                flex: 0 0 50%;
                height: 100vh;
                overflow-y: auto;
                border-bottom: none;
                border-right: 2px solid var(--border);
                box-shadow: 4px 0 6px -1px rgba(0,0,0,0.05);
                padding: 20px 0;
            }
            .main-scroll-area { flex: 0 0 50%; height: 100vh; padding-bottom: 200px; }
            .container { max-width: 100%; padding: 0 30px; }
            #custom-keyboard { width: 50%; left: 50%; border-left: 1px solid #94a3b8; }
            .kb-key { max-width: 55px !important; }
            .kb-key.wide { max-width: 80px !important; }
            .kb-key.space { max-width: 250px !important; }
            .kb-key.done { max-width: 100px !important; }
            .kb-key.proper { max-width: 80px !important; }
            .pdf-viewport { height: calc(100vh - 280px) !important; max-height: none !important; }
        }

        /* --- MOBILE LAYOUT RULES --- */
        @media (max-width: 991px) {
            .mobile-view-tabs { display: flex; }
            
            body[data-mobile-view="split"] .pdf-viewport {
                height: 25vh !important;
                max-height: 25vh !important;
                display: block !important;
            }

            body[data-mobile-view="answers"] #pdf-viewport-container,
            body[data-mobile-view="answers"] #pdf-toolbar,
            body[data-mobile-view="answers"] .pdf-setup-card {
                display: none !important;
            }

            body[data-mobile-view="pdf"] .main-scroll-area,
            body[data-mobile-view="pdf"] .global-actions {
                display: none !important;
            }
            body[data-mobile-view="pdf"] .pdf-viewport {
                height: calc(100vh - 240px) !important;
                max-height: none !important;
                display: block !important;
            }
        }

        /* Media Setup */
        .media-setup { background: var(--card-bg); padding: 12px; border-radius: 8px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
        @media (min-width: 600px) { .media-setup { flex-direction: row; } }
        .input-group { display: flex; flex: 1; gap: 6px; align-items: center; }
        input[type="text"], input[type="file"] { flex: 1; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }

        button { 
            display: inline-flex; align-items: center; justify-content: center; gap: 5px; 
            background: var(--primary); color: white; border: none; padding: 7px 12px; 
            border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; transition: 0.2s; 
        }
        button svg { width: 14px; height: 14px; flex-shrink: 0; }
        button:hover { background: var(--primary-hover); }
        .btn-sm { padding: 4px 8px; font-size: 12px; border-radius: 4px; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: #eff6ff; }
        .btn-danger { background: transparent; border: 1px solid #ef4444; color: #ef4444; }
        .btn-danger:hover { background: #fef2f2; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        .btn-print { background: #4f46e5; }
        .btn-print:hover { background: #4338ca; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-warning:hover { background: #d97706; }

        .video-wrapper { position: relative; background: #000; border-radius: 8px; display: none; overflow: hidden; margin-bottom: 10px; }
        .video-wrapper.is-video { padding-bottom: 56.25%; height: 0; }
        .video-wrapper.is-video iframe, .video-wrapper.is-video video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .video-wrapper.is-audio { background: var(--card-bg); padding: 12px; }
        .video-wrapper.is-audio audio { width: 100%; outline: none; }

        .score-banner { display: none; background: #10b981; color: white; text-align: center; padding: 8px; font-weight: bold; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }

        /* PDF & Audio Panel */
        #pdf-study-panel { display: none; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .pdf-setup-card { background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
        .pdf-input-row { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
        
        .pdf-audio-bar { display: none; background: #1e293b; color: white; padding: 8px 12px; border-radius: 8px; align-items: center; gap: 8px; flex-wrap: wrap; }
        .pdf-audio-bar button { background: #334155; padding: 5px 8px; font-size: 12px; border-radius: 5px; }
        .pdf-audio-bar button:hover { background: #475569; }
        .pdf-audio-progress { flex: 1; min-width: 80px; accent-color: var(--primary); cursor: pointer; }
        .pdf-speed-select { background: #334155; color: white; border: none; padding: 4px 6px; border-radius: 4px; font-size: 11px; outline: none; }

        .pdf-toolbar { display: none; background: #e2e8f0; padding: 6px 10px; border-radius: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: 12px; font-weight: 600; }
        .pdf-tool-group { display: flex; align-items: center; gap: 4px; }
        .pdf-tool-group button { padding: 4px 8px; font-size: 12px; }

        .pdf-viewport {
            display: none; height: 260px; overflow: auto; background: #475569;
            border-radius: 8px; border: 1px solid var(--border); position: relative; text-align: center;
            cursor: grab; user-select: none; -webkit-overflow-scrolling: touch;
        }
        .pdf-viewport.grabbing { cursor: grabbing; }
        #pdf-canvas { margin: 8px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); background: white; display: inline-block; transition: transform 0.05s linear; }

        /* Workspace */
        .section-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: var(--card-bg); padding: 8px 12px; border-radius: 8px; }
        .sec-indicator { font-weight: bold; color: var(--primary); font-size: 14px; }
        
        .section-card { background: var(--card-bg); padding: 16px; border-radius: 10px; margin-bottom: 16px; border-left: 4px solid var(--primary); display: none; }
        .section-card.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }

        .section-header { display: flex; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
        .section-header div { display: flex; gap: 5px; }
        .section-title { font-size: 1.15rem; font-weight: bold; border: none; border-bottom: 2px dashed var(--border); padding: 3px; flex: 1; background: transparent; }
        
        /* Time Mark */
        .time-marks-area { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; background: #f8fafc; padding: 6px 10px; border-radius: 8px; border: 1px dashed var(--border); }
        .time-badge { background: #e0e7ff; color: var(--primary); padding: 3px 8px; border-radius: 12px; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-weight: bold; border: 1px solid #c7d2fe; transition: 0.2s; }
        .time-badge:hover { background: #c7d2fe; }
        .time-badge button { background: none; border: none; color: #ef4444; cursor: pointer; padding: 0; width: auto; height: auto; }
        .time-badge button svg { width: 11px; height: 11px; }

        .answers-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
        .answer-row { display: flex; flex-direction: column; gap: 8px; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        .answer-row[data-correct="true"] { background-color: var(--correct-bg); border-color: #86efac; }
        .answer-row[data-correct="false"] { background-color: var(--incorrect-bg); border-color: #fca5a5; }

        .answer-main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .answer-num { font-weight: bold; color: var(--primary); min-width: 24px; text-align: right; font-size: 14px; }
        .answer-input, .reason-input, .section-title, .mcq-desc, .mcq-correct-desc { cursor: text; flex: 1; border: none; background: transparent; border-bottom: 1px solid var(--border); padding: 5px; font-size: 15px; min-width: 100px; }
        
        .reason-input { width: 100%; border: 1px dashed var(--text-muted); padding: 7px; border-radius: 6px; background: white; font-size: 13px; }
        
        .answer-row[data-type="essay"] .mcq-ui { display: none !important; }
        .answer-row[data-type="mcq"] .essay-ui { display: none !important; }
        .mcq-ui { display: flex; gap: 6px; flex: 1; align-items: center; width: 100%; }

        .mcq-select, .mcq-correct-select {
            display: inline-flex; align-items: center; justify-content: center; gap: 4px;
            padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: #ffffff;
            color: var(--text-main); font-size: 13px; font-weight: 600; min-width: 58px; height: 34px;
            outline: none; cursor: pointer; transition: all 0.2s ease;
        }
        .mcq-select:hover, .mcq-correct-select:hover { border-color: var(--primary); background: #f8fafc; }
        .mcq-select.has-value { background: #eff6ff; border-color: var(--primary); color: var(--primary); }
        .mcq-correct-select.has-value { background: #ecfdf5; border-color: #10b981; color: #059669; }

        .input-active { border-bottom: 2px solid var(--primary) !important; background-color: #eff6ff !important; border-radius: 4px; outline: none; }

        .correction-ui { display: none; flex-direction: column; gap: 6px; padding-left: 32px; }
        .correction-tools { display: flex; gap: 8px; align-items: center; }
        .btn-icon { padding: 5px; border-radius: 50%; background: transparent; border: 1px solid var(--border); display: flex; align-items: center; cursor: pointer; color: var(--text-main); }
        .btn-icon svg { width: 16px; height: 16px; }
        .btn-icon.check:hover { background: #dcfce7; border-color: #22c55e; color: #16a34a; }
        .btn-icon.cross:hover { background: #fee2e2; border-color: #ef4444; color: #dc2626; }

        .global-actions { text-align: center; margin-bottom: 40px; }

        /* Custom Keyboard */
        #custom-keyboard {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #cbd5e1; padding: 8px 4px 12px 4px; box-shadow: 0 -4px 15px rgba(0,0,0,0.15);
            z-index: 1000; display: flex; flex-direction: column; gap: 6px; transform: translateY(100%); transition: transform 0.25s ease-out; user-select: none;
        }
        #custom-keyboard.show { transform: translateY(0); }
        .kb-row { display: flex; justify-content: center; gap: 5px; }
        .kb-key {
            background: #ffffff; border-radius: 6px; padding: 10px 4px; font-size: 1.15rem; font-weight: 500; text-align: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2); flex: 1; max-width: 44px; cursor: pointer; touch-action: manipulation; display: flex; align-items: center; justify-content: center;
        }
        .kb-key:active { background: #e2e8f0; transform: scale(0.95); }
        .kb-key.wide { max-width: 60px; font-size: 0.95rem; background: #94a3b8; color: white; }
        .kb-key.space { max-width: 140px; font-size: 0.95rem; }
        .kb-key.done { max-width: 75px; font-size: 0.95rem; background: var(--primary); color: white; }
        .kb-key.proper { max-width: 60px; font-size: 0.95rem; background: #10b981; color: white; }

        @media print {
            html, body { height: auto !important; overflow: visible !important; display: block !important; }
            .sticky-zone { display: none !important; }
            .main-scroll-area { height: auto !important; overflow: visible !important; display: block !important; padding: 0 !important; width: 100% !important; flex: none !important; }
            .section-nav-bar, .global-actions, button:not(.mcq-select):not(.mcq-correct-select), #custom-keyboard, .time-marks-area { display: none !important; }
            .section-card { display: block !important; box-shadow: none; border: none; border-bottom: 2px solid #000; margin-bottom: 10px; padding: 0 !important; }
            .answer-row { background: transparent !important; border: none !important; padding: 5px 0; }
            .answer-input, .reason-input, .mcq-desc, .mcq-correct-desc { border-bottom: 1px solid #000; color: black; }
            .mcq-select, .mcq-correct-select { display: inline-flex !important; border: 1px solid #000 !important; color: black !important; background: transparent !important; box-shadow: none !important; }
        }
    </style>
</head>
<body data-mobile-view="split">

<div class="sticky-zone">
    <div class="container">
        <header><h1>IELTS Listening Pro</h1></header>
        
        <div class="source-mode-tabs">
            <button class="tab-btn active" id="tab-media" onclick="switchMediaMode('media')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                Media Player
            </button>
            <button class="tab-btn" id="tab-pdf" onclick="switchMediaMode('pdf')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                PDF & Audio
            </button>
        </div>

        <div class="top-actions">
            <button class="btn-success" onclick="saveData(true)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline></svg>
                Save
            </button>
            <button class="btn-warning" onclick="toggleCorrectionMode()" id="btn-correction">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Correction
            </button>
            <button class="btn-print" onclick="window.open('../../print/listening/index.html', '_blank')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                Print
            </button>
            <button class="btn-outline" onclick="toggleKeyboardMode()" id="btn-kb-mode">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="6" y1="8" x2="6.01" y2="8"></line><line x1="10" y1="8" x2="10.01" y2="8"></line><line x1="14" y1="8" x2="14.01" y2="8"></line><line x1="18" y1="8" x2="18.01" y2="8"></line></svg>
                KB: ON
            </button>
            <button class="btn-outline" onclick="toggleSoundMode()" id="btn-sound-mode">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line></svg>
                Sound: OFF
            </button>
        </div>

        <!-- 1. VIDEO / YOUTUBE SECTION -->
        <div id="media-mode-panel">
            <div class="media-setup" id="media-setup-box">
                <div class="input-group">
                    <input type="text" id="yt-link" placeholder="YouTube Link...">
                    <button onclick="loadYouTube()">Load YT</button>
                </div>
                <div class="input-group">
                    <input type="file" id="local-file" accept="video/mp4,audio/*,video/*" onchange="loadLocalFile(this)">
                    <span class="file-status-badge" id="media-file-badge"></span>
                </div>
            </div>
            <div class="video-wrapper" id="video-wrapper"></div>
            <div id="media-restore-bar" style="display: none; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span id="media-active-title" style="font-size: 12px; font-weight: 600; color: #475569;"></span>
                <button class="btn-outline btn-sm" onclick="showMediaChangeBox()">Change Source</button>
            </div>
        </div>

        <!-- 2. PDF & AUDIO STUDY SECTION -->
        <div id="pdf-study-panel">
            <div class="mobile-view-tabs" id="mobile-view-tabs">
                <button type="button" class="mobile-view-btn active" data-view="split" onclick="setMobileViewMode('split')">Split View</button>
                <button type="button" class="mobile-view-btn" data-view="answers" onclick="setMobileViewMode('answers')">Answer Sheet</button>
                <button type="button" class="mobile-view-btn" data-view="pdf" onclick="setMobileViewMode('pdf')">PDF Focus</button>
            </div>

            <div class="pdf-setup-card" id="pdf-setup-card">
                <div class="pdf-input-row">
                    <span>PDF Document:</span>
                    <input type="file" id="pdf-file-picker" accept="application/pdf" onchange="ByPdf.loadPdfFile(this)">
                    <span class="file-status-badge" id="pdf-doc-status-name"></span>
                </div>
                <div class="pdf-input-row">
                    <span>Audio Track:</span>
                    <input type="file" id="audio-file-picker" accept="audio/*" onchange="ByPdf.loadAudioFile(this)">
                    <span class="file-status-badge" id="pdf-audio-status-name"></span>
                </div>
            </div>

            <!-- Audio Controller Bar -->
            <div class="pdf-audio-bar" id="pdf-audio-bar">
                <button type="button" id="pdf-btn-play" onclick="ByPdf.togglePlay()">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    Play
                </button>
                <button type="button" onclick="ByPdf.seekRelative(-5)">-5s</button>
                <button type="button" onclick="ByPdf.seekRelative(5)">+5s</button>
                <input type="range" class="pdf-audio-progress" id="pdf-audio-progress" value="0" min="0" max="100">
                <span id="pdf-audio-time" style="font-size: 11px; font-family: monospace;">00:00 / 00:00</span>
                <select class="pdf-speed-select" onchange="ByPdf.setSpeed(this.value)">
                    <option value="0.75">0.75x</option>
                    <option value="1.0" selected>1.0x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                </select>
                <audio id="pdf-audio-player" style="display: none;"></audio>
            </div>

            <!-- Enhanced PDF Toolbar (Interactive Page Jump, Reset View, Zoom Controls) -->
            <div class="pdf-toolbar" id="pdf-toolbar">
                <div class="pdf-tool-group">
                    <button class="btn-outline btn-sm" onclick="ByPdf.changePage(-1)" title="Previous Page">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        Prev
                    </button>
                    <span style="display: inline-flex; align-items: center; gap: 3px;">
                        Page
                        <input type="number" id="pdf-page-input" min="1" value="1" onchange="ByPdf.goToPage(this.value)" onkeydown="if(event.key==='Enter')ByPdf.goToPage(this.value)" style="width: 44px; text-align: center; padding: 2px 4px; font-weight: bold; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; background: white;">
                        / <span id="pdf-total-pages">1</span>
                    </span>
                    <button class="btn-outline btn-sm" onclick="ByPdf.changePage(1)" title="Next Page">
                        Next
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                    <button class="btn-outline btn-sm" onclick="ByPdf.resetView()" title="Reset to Page 1 & Fit Width">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                        Reset
                    </button>
                </div>
                <div class="pdf-tool-group">

                    <button class="btn-outline btn-sm" onclick="ByPdf.addBookmark()">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                        Bookmark

                    <button class="btn-outline btn-sm" id="pdf-btn-view-bm" onclick="ByPdf.showBookmarksModal()">Bookmarks (0)</button>

    <div class="container" id="workspace-container">
        <div class="section-nav-bar">
            <button id="btn-prev-sec" onclick="navigateSection(-1)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>

            </button>
            <span class="sec-indicator" id="sec-indicator">Part 1 of 1</span>

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Add New Part
            </button>
        </div>
    </div>
</div>

<div id="custom-keyboard"></div>

<script src="byPdf.js"></script>

<script>
    const ICON_PRACTICE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
    const ICON_CORRECTION = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    const ICON_KEYBOARD = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="6" y1="8" x2="6.01" y2="8"></line><line x1="10" y1="8" x2="10.01" y2="8"></line><line x1="14" y1="8" x2="14.01" y2="8"></line><line x1="18" y1="8" x2="18.01" y2="8"></line></svg>`;
    const ICON_SOUND_ON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
    const ICON_SOUND_OFF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line></svg>`;
    const ICON_DOWN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
    const ICON_RIGHT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>`;
    const ICON_TRASH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
    const ICON_CLOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;
    const ICON_PLUS = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`;
    const ICON_SWITCH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline></svg>`;
    const ICON_CROSS = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;

    let sectionCount = 0;
    let currentSectionIndex = 0;
    let isCorrectionMode = false;
    let useCustomKB = true;
    let soundEnabled = false;
    let activeInputTarget = null;
    let audioCtx = null;
    let activeStudyMode = 'media';
    const LOCAL_STORAGE_KEY = 'ielts_listening_pro_v5';
    const SAVED_YT_URL_KEY = 'ielts_saved_yt_url';

    const MEDIA_DB_NAME = 'IeltsListeningStorage';
    const MEDIA_STORE_NAME = 'media_files';

    function setMobileViewMode(mode) {
        document.body.dataset.mobileView = mode;
        document.querySelectorAll('.mobile-view-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.view === mode);
        });
        if (mode !== 'answers' && window.ByPdf) {
            setTimeout(() => ByPdf.fitWidth(), 80);
        }
    }

    function switchMediaMode(mode) {
        activeStudyMode = mode;
        const btnMedia = document.getElementById('tab-media');
        const btnPdf = document.getElementById('tab-pdf');
        const panelMedia = document.getElementById('media-mode-panel');
        const panelPdf = document.getElementById('pdf-study-panel');

        if (mode === 'pdf') {
            btnPdf.classList.add('active');
            btnMedia.classList.remove('active');
            panelMedia.style.display = 'none';
            panelPdf.style.display = 'flex';
            if (window.ByPdf) setTimeout(() => ByPdf.fitWidth(), 100);
        } else {
            btnMedia.classList.add('active');
            btnPdf.classList.remove('active');
            panelMedia.style.display = 'block';
            panelPdf.style.display = 'none';
        }
    }

    // --- MEDIA PLAYER CONTROL WITH STORAGE ---
    let ytPlayer = null;
    let localPlayer = null;

    function loadYouTube(explicitUrl = null) {
        const url = explicitUrl || document.getElementById('yt-link').value.trim();
        const videoId = extractYouTubeID(url);
        if (!videoId) {
            if (!explicitUrl) Swal.fire({icon: 'error', title: 'Invalid Link', text: 'Please enter a valid YouTube URL.'});
            return;
        }

        localStorage.setItem(SAVED_YT_URL_KEY, url);
        document.getElementById('yt-link').value = url;

        const wrapper = document.getElementById('video-wrapper');
        wrapper.style.display = 'block'; wrapper.className = 'video-wrapper is-video';
        
        if (ytPlayer && ytPlayer.destroy) ytPlayer.destroy();
        wrapper.innerHTML = '<div id="yt-iframe-container"></div>';
        
        ytPlayer = new YT.Player('yt-iframe-container', {
            videoId: videoId,
            playerVars: { 'playsinline': 1, 'rel': 0 },
            events: { 'onReady': () => { localPlayer = null; } }
        });
        document.getElementById('media-setup-box').style.display = 'none';
        showMediaRestoreBar('YouTube Video Loaded');
    }

    function extractYouTubeID(url) {
        const regex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
        return url.match(regex)?.[1] || null;
    }

    function loadLocalFile(input) {
        const file = input.files && input.files[0];
        if (!file) return;

        try {
            const dbReq = indexedDB.open(MEDIA_DB_NAME, 1);
            dbReq.onsuccess = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(MEDIA_STORE_NAME)) return;
                const tx = db.transaction(MEDIA_STORE_NAME, 'readwrite');
                tx.objectStore(MEDIA_STORE_NAME).put({ blob: file, name: file.name, type: file.type }, 'cached_media_file');
            };
        } catch(e) {}

        applyLocalMediaBlob(file, file.name);
    }

    function applyLocalMediaBlob(blob, name) {
        const wrapper = document.getElementById('video-wrapper');
        wrapper.style.display = 'block';
        if (ytPlayer && ytPlayer.destroy) { ytPlayer.destroy(); ytPlayer = null; }

        if (blob.type.startsWith('audio/')) {
            wrapper.className = 'video-wrapper is-audio';
            wrapper.innerHTML = `<audio id="local-media" controls src="${URL.createObjectURL(blob)}"></audio>`;
        } else {
            wrapper.className = 'video-wrapper is-video';
            wrapper.innerHTML = `<video id="local-media" controls src="${URL.createObjectURL(blob)}"></video>`;
        }
        localPlayer = document.getElementById('local-media');
        document.getElementById('media-setup-box').style.display = 'none';
        showMediaRestoreBar(`File: ${name}`);
    }

    function showMediaRestoreBar(title) {
        const bar = document.getElementById('media-restore-bar');
        const text = document.getElementById('media-active-title');
        if (bar && text) {
            text.textContent = title;
            bar.style.display = 'flex';
        }
    }

    function showMediaChangeBox() {
        document.getElementById('media-setup-box').style.display = 'flex';
        document.getElementById('media-restore-bar').style.display = 'none';
    }

    function restoreMediaMode() {
        const savedUrl = localStorage.getItem(SAVED_YT_URL_KEY);
        if (savedUrl) {
            document.getElementById('yt-link').value = savedUrl;
            if (window.YT && window.YT.Player) {
                loadYouTube(savedUrl);
            } else {
                window.onYouTubeIframeAPIReady = () => loadYouTube(savedUrl);
            }
        }

        try {
            const req = indexedDB.open(MEDIA_DB_NAME, 1);
            req.onsuccess = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(MEDIA_STORE_NAME)) return;
                const tx = db.transaction(MEDIA_STORE_NAME, 'readonly');
                const getReq = tx.objectStore(MEDIA_STORE_NAME).get('cached_media_file');
                getReq.onsuccess = () => {
                    if (getReq.result && getReq.result.blob && !savedUrl) {
                        applyLocalMediaBlob(getReq.result.blob, getReq.result.name);
                    }
                };
            };
        } catch(e) {}
    }

    // --- TIME MARKS ---
    function getCurrentMediaTime() {
        if (activeStudyMode === 'pdf' && window.ByPdf) {
            const pdfTime = ByPdf.getAudioTime();
            if (pdfTime !== null) return pdfTime;
        }
        if (localPlayer) return localPlayer.currentTime;
        if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') return ytPlayer.getCurrentTime();
        return null;
    }

    function seekMediaTime(seconds) {
        if (activeStudyMode === 'pdf' && window.ByPdf) {
            if (ByPdf.seekAudio(seconds)) return;
        }
        if (localPlayer) { localPlayer.currentTime = seconds; localPlayer.play(); }
        else if (ytPlayer && typeof ytPlayer.seekTo === 'function') { ytPlayer.seekTo(seconds, true); ytPlayer.playVideo(); }
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = Math.floor(seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    // --- WORKSPACE & SECTIONS ---
    function addSection(title = null, skipSave = false) {
        sectionCount++;
        const workspace = document.getElementById('workspace');
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'section-card';
        
        sectionDiv.innerHTML = `
            <div class="section-header">
                <input type="text" class="section-title target-input" value="${title !== null ? title : `Part ${sectionCount}`}" oninput="saveData()">
                <div>
                    <button class="btn-outline btn-sm" onclick="toggleCollapse(this)">${ICON_DOWN} Hide</button>
                    <button class="btn-danger btn-sm" onclick="removeSection(this)">${ICON_TRASH}</button>
                </div>
            </div>
            <div class="time-marks-area">
                <button class="btn-outline btn-sm" onclick="addTimeMark(this)">${ICON_CLOCK} Time Mark</button>
                <div class="time-container"></div>
            </div>
            <div class="answers-container"></div>
            <button class="btn-outline" onclick="addAnswer(this)">${ICON_PLUS} Add Answer</button>
        `;
        workspace.appendChild(sectionDiv);
        applyInputProtection(); 
        
        if(!skipSave) {
            addAnswer(sectionDiv.querySelector('.answers-container').nextElementSibling);
            currentSectionIndex = document.querySelectorAll('.section-card').length - 1;
            updateSectionNav();
        }
        return sectionDiv;
    }

    function addTimeMark(btn, forcedTime = null) {
        const time = forcedTime !== null ? forcedTime : getCurrentMediaTime();
        if (time === null) return Swal.fire({icon: 'warning', title: 'Media Paused', text: 'Play audio or video first to record timestamps.'});
        
        const container = btn.nextElementSibling;
        const badge = document.createElement('span');
        badge.className = 'time-badge';
        badge.dataset.time = time;
        badge.innerHTML = `[ ${formatTime(time)} ] <button onclick="removeTimeMark(this, event)">${ICON_CROSS}</button>`;
        badge.onclick = (e) => { if(!e.target.closest('button')) seekMediaTime(parseFloat(time)); };
        container.appendChild(badge);
        if (forcedTime === null) saveData();
    }

    function removeTimeMark(btn, event) {
        event.stopPropagation();
        btn.closest('.time-badge').remove();
        saveData();
    }

    function toggleCollapse(btn) {
        const container = btn.closest('.section-card').querySelector('.answers-container');
        if (container.style.display === 'none') { container.style.display = 'flex'; btn.innerHTML = `${ICON_DOWN} Hide`; } 
        else { container.style.display = 'none'; btn.innerHTML = `${ICON_RIGHT} Expand`; }
    }

    function removeSection(btn) {
        Swal.fire({
            title: 'Delete Section?', text: "This will remove all items inside this part.", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Yes, delete'
        }).then((result) => {
            if (result.isConfirmed) {
                btn.closest('.section-card').remove();
                if(currentSectionIndex > 0) currentSectionIndex--;
                updateGlobalNumbering(); updateSectionNav(); saveData();
            }
        });
    }

    // --- SWEETALERT MODAL OPTIONS ---
    function openOptionModal(btn, type) {
        const isKey = type === 'key';
        const currentValue = btn.value || '';
        const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
        
        const buttonsGrid = letters.map(l => {
            const isSelected = currentValue === l;
            const activeBg = isKey ? '#10b981' : '#2563eb';
            return `
                <button type="button" class="swal-opt-choice ${isSelected ? 'selected' : ''}" data-val="${l}" style="
                    padding: 12px 0; font-size: 1.15rem; font-weight: 700; border-radius: 8px;
                    border: 2px solid ${isSelected ? activeBg : '#e2e8f0'}; background: ${isSelected ? activeBg : '#ffffff'};
                    color: ${isSelected ? '#ffffff' : '#1e293b'}; cursor: pointer; transition: all 0.15s ease;
                ">
                    ${l}
                </button>
            `;
        }).join('');

        Swal.fire({
            title: isKey ? 'Select Answer Key' : 'Select Option Answer',
            html: `
                <div style="margin: 10px 0 5px 0;">
                    <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 12px;">Choose option letter:</p>
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px;">
                        ${buttonsGrid}
                    </div>
                    <button type="button" id="swal-opt-clear" style="
                        width: 100%; padding: 8px; font-size: 0.9rem; font-weight: 600; border-radius: 6px;
                        border: 1px dashed #cbd5e1; background: #f8fafc; color: #64748b; cursor: pointer;
                    ">
                        Clear Selection
                    </button>
                </div>
            `,
            showConfirmButton: false,
            showCloseButton: true,
            width: 360,
            didOpen: () => {
                const popup = Swal.getPopup();
                popup.querySelectorAll('.swal-opt-choice').forEach(choiceBtn => {
                    choiceBtn.onclick = () => {
                        playClickSound();
                        setOptionValue(btn, choiceBtn.dataset.val, isKey);
                        Swal.close();
                    };
                });

                const clearBtn = popup.querySelector('#swal-opt-clear');
                if (clearBtn) {
                    clearBtn.onclick = () => {
                        playClickSound();
                        setOptionValue(btn, '', isKey);
                        Swal.close();
                    };
                }
            }
        });
    }

    function setOptionValue(btn, val, isKey) {
        btn.value = val;
        btn.setAttribute('value', val);
        const arrow = `<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
        
        if (val) {
            btn.innerHTML = `${isKey ? 'Key: ' + val : val} ${arrow}`;
            btn.classList.add('has-value');
        } else {
            btn.innerHTML = `${isKey ? 'Key' : 'Opt'} ${arrow}`;
            btn.classList.remove('has-value');
        }
        saveData();
    }

    // --- ANSWERS ---
    function addAnswer(btn, data = {type: "essay", text: "", mcqOpt: "", mcqDesc: "", correct: "null", correctOpt: "", correctDesc: "", reason: ""}) {
        const container = btn.closest('.section-card').querySelector('.answers-container');
        const row = document.createElement('div');
        row.className = 'answer-row'; 
        row.dataset.correct = data.correct;
        row.dataset.type = data.type;

        const arrowSvg = `<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
        const mcqOpt = data.mcqOpt || "";
        const correctOpt = data.correctOpt || "";

        row.innerHTML = `
            <div class="answer-main">
                <span class="answer-num"></span>
                <input type="text" class="answer-input essay-ui target-input" value="${data.text}" placeholder="Write answer..." oninput="saveData()">
                <div class="mcq-ui">
                    <button type="button" class="mcq-select ${mcqOpt ? 'has-value' : ''}" value="${mcqOpt}" onclick="openOptionModal(this, 'opt')">
                        ${mcqOpt ? mcqOpt : 'Opt'} ${arrowSvg}
                    </button>
                    <input type="text" class="mcq-desc target-input" value="${data.mcqDesc}" placeholder="Option description..." oninput="saveData()">
                </div>
                <button class="btn-outline btn-sm" onclick="toggleAnswerType(this)" title="Switch Type">${ICON_SWITCH}</button>
                <button class="btn-danger btn-sm" onclick="removeAnswer(this)">${ICON_CROSS}</button>
            </div>
            <div class="correction-ui" style="display: ${isCorrectionMode ? 'flex' : 'none'};">
                <div class="correction-tools">
                    <button class="btn-icon check" onclick="markCorrect(this, 'true')">${ICON_CORRECTION}</button>
                    <button class="btn-icon cross" onclick="markCorrect(this, 'false')">${ICON_CROSS}</button>
                </div>
                <div class="mcq-ui" style="margin-top: 4px;">
                    <button type="button" class="mcq-correct-select ${correctOpt ? 'has-value' : ''}" value="${correctOpt}" onclick="openOptionModal(this, 'key')">
                        ${correctOpt ? 'Key: ' + correctOpt : 'Key'} ${arrowSvg}
                    </button>
                    <input type="text" class="mcq-correct-desc target-input" value="${data.correctDesc}" placeholder="Correct key description..." oninput="saveData()">
                </div>
                <input type="text" class="reason-input target-input" value="${data.reason}" placeholder="Reason / Explanation (Optional)..." oninput="saveData()">
            </div>
        `;
        container.appendChild(row);
        applyInputProtection(); updateGlobalNumbering(); calculateScore(); saveData();
    }

    function toggleAnswerType(btn) {
        const row = btn.closest('.answer-row');
        row.dataset.type = row.dataset.type === 'essay' ? 'mcq' : 'essay';
        saveData();
    }

    function removeAnswer(btn) { btn.closest('.answer-row').remove(); updateGlobalNumbering(); calculateScore(); saveData(); }
    function updateGlobalNumbering() { document.querySelectorAll('.answer-row').forEach((row, i) => { row.querySelector('.answer-num').textContent = (i + 1) + "."; }); }

    function updateSectionNav() {
        const sections = document.querySelectorAll('.section-card');
        if (!sections.length) return;
        sections.forEach((sec, i) => { sec.classList.remove('active'); if (i === currentSectionIndex) sec.classList.add('active'); });
        document.getElementById('btn-prev-sec').disabled = (currentSectionIndex === 0);
        document.getElementById('btn-next-sec').disabled = (currentSectionIndex === sections.length - 1);
        document.getElementById('sec-indicator').textContent = `Part ${currentSectionIndex + 1} of ${sections.length}`;
    }
    
    function navigateSection(dir) {
        const len = document.querySelectorAll('.section-card').length;
        currentSectionIndex = Math.max(0, Math.min(len - 1, currentSectionIndex + dir));
        updateSectionNav();
    }

    function toggleCorrectionMode() {
        isCorrectionMode = !isCorrectionMode;
        const btn = document.getElementById('btn-correction');
        if (isCorrectionMode) { btn.innerHTML = `${ICON_PRACTICE} Practice`; btn.className = "btn-outline"; document.getElementById('score-banner').style.display = "block"; } 
        else { btn.innerHTML = `${ICON_CORRECTION} Correction`; btn.className = "btn-warning"; document.getElementById('score-banner').style.display = "none"; }
        document.querySelectorAll('.correction-ui').forEach(ui => ui.style.display = isCorrectionMode ? 'flex' : 'none');
        calculateScore();
    }
    
    function markCorrect(btn, status) { btn.closest('.answer-row').dataset.correct = status; calculateScore(); saveData(); }
    
    function calculateScore() {
        const rows = document.querySelectorAll('.answer-row');
        let correctCount = 0; rows.forEach(row => { if (row.dataset.correct === 'true') correctCount++; });
        document.getElementById('score-banner').textContent = `Score: ${correctCount} / ${rows.length}`;
    }

    function toggleSoundMode() {
        soundEnabled = !soundEnabled;
        const btn = document.getElementById('btn-sound-mode');
        btn.innerHTML = soundEnabled ? `${ICON_SOUND_ON} Sound: ON` : `${ICON_SOUND_OFF} Sound: OFF`;
    }

    function playClickSound() {
        if (!soundEnabled) return;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.05);
        } catch(e) {}
    }

    // --- CUSTOM KEYBOARD ---
    let kbShift = false, kbSymbol = false, kbMoreSymbol = false;
    const kbLayouts = {
        lowercase: [['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['⇧','z','x','c','v','b','n','m','⌫'],['123','Case','Space','Done']],
        uppercase: [['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['⬆','Z','X','C','V','B','N','M','⌫'],['123','Case','Space','Done']],
        symbols: [['1','2','3','4','5','6','7','8','9','0'],['-','/',':',';','(',')','$','&','@','"'],['#+=','.','\,','?','!','\'','⌫'],['abc','Case','Space','Done']],
        more_symbols: [['[',']','{','}','#','%','^','*','+','='],['_','\\','|','~','<','>','€','£','¥','¢'],['123','.','\,','?','!','\'','⌫'],['abc','Case','Space','Done']]
    };

    function renderKeyboard() {
        const kb = document.getElementById('custom-keyboard');
        let layoutName = kbMoreSymbol ? 'more_symbols' : (kbSymbol ? 'symbols' : (kbShift ? 'uppercase' : 'lowercase'));
        kb.innerHTML = '';
        
        kbLayouts[layoutName].forEach(row => {
            const rowDiv = document.createElement('div'); rowDiv.className = 'kb-row';
            row.forEach(key => {
                const btn = document.createElement('div'); btn.className = 'kb-key';
                let label = key; if(key === 'Space') label = 'Space'; if(key === 'Case') label = 'Aa';
                btn.textContent = label;
                
                if(['⇧','⬆','⌫','123','abc','#+='].includes(key)) btn.classList.add('wide');
                if(key === 'Space') btn.classList.add('space');
                if(key === 'Done') btn.classList.add('done');
                if(key === 'Case') btn.classList.add('proper');

                const triggerKey = (e) => { e.preventDefault(); e.stopPropagation(); handleKey(key); };
                btn.onmousedown = triggerKey; btn.ontouchstart = triggerKey;
                rowDiv.appendChild(btn);
            });
            kb.appendChild(rowDiv);
        });
    }

    function handleKey(key) {
        if(!activeInputTarget) return;
        playClickSound();

        let val = activeInputTarget.value;
        let start = activeInputTarget.selectionStart;
        let end = activeInputTarget.selectionEnd;
        let hasSelection = start !== end;

        if(!['⇧','⬆','123','abc','#+=','Done','Space','⌫','Case'].includes(key)) {
            activeInputTarget.value = val.substring(0, start) + key + val.substring(end);
            activeInputTarget.setSelectionRange(start + key.length, start + key.length);
            if(kbShift) { kbShift = false; renderKeyboard(); }
            saveData(); return;
        }

        if(key === '⇧' || key === '⬆') { kbShift = !kbShift; renderKeyboard(); return; }
        if(key === '123') { kbSymbol = true; kbMoreSymbol = false; renderKeyboard(); return; }
        if(key === '#+=') { kbSymbol = false; kbMoreSymbol = true; renderKeyboard(); return; }
        if(key === 'abc') { kbSymbol = false; kbMoreSymbol = false; renderKeyboard(); return; }
        if(key === 'Done') { hideKeyboard(); return; }
        
        if(key === 'Space') { 
            activeInputTarget.value = val.substring(0, start) + ' ' + val.substring(end);
            activeInputTarget.setSelectionRange(start + 1, start + 1);
            saveData(); return; 
        }
        
        if(key === '⌫') { 
            if (hasSelection) {
                activeInputTarget.value = val.substring(0, start) + val.substring(end);
                activeInputTarget.setSelectionRange(start, start);
            } else if (start > 0) {
                activeInputTarget.value = val.substring(0, start - 1) + val.substring(end);
                activeInputTarget.setSelectionRange(start - 1, start - 1);
            }
            saveData(); return; 
        }
        
        if(key === 'Case') { 
            let targetText = hasSelection ? val.substring(start, end) : val;
            let currentCaseState = activeInputTarget.dataset.caseState || "0"; 
            let newText = "";
            
            if (currentCaseState === "0" || currentCaseState === "3") {
                newText = targetText.split(' ').map(w => w ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : '').join(' ');
                activeInputTarget.dataset.caseState = "1";
            } else if (currentCaseState === "1") {
                newText = targetText.toLowerCase();
                activeInputTarget.dataset.caseState = "2";
            } else if (currentCaseState === "2") {
                newText = targetText.toUpperCase();
                activeInputTarget.dataset.caseState = "3";
            }
            
            if (hasSelection) {
                activeInputTarget.value = val.substring(0, start) + newText + val.substring(end);
                activeInputTarget.setSelectionRange(start, start + newText.length);
            } else {
                activeInputTarget.value = newText;
                activeInputTarget.setSelectionRange(newText.length, newText.length);
            }
            saveData(); return; 
        }
    }

    function showKeyboard(inputElem) {
        if(!useCustomKB) return;
        activeInputTarget = inputElem;
        document.querySelectorAll('.target-input').forEach(el => el.classList.remove('input-active'));
        inputElem.classList.add('input-active');
        document.getElementById('custom-keyboard').classList.add('show');
        
        setTimeout(() => {
            inputElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    }

    function hideKeyboard() {
        document.getElementById('custom-keyboard').classList.remove('show');
        if(activeInputTarget) activeInputTarget.classList.remove('input-active');
        activeInputTarget = null;
    }

    function toggleKeyboardMode() {
        useCustomKB = !useCustomKB;
        document.getElementById('btn-kb-mode').innerHTML = useCustomKB ? `${ICON_KEYBOARD} KB: ON` : `${ICON_KEYBOARD} KB: OFF`;
        hideKeyboard(); applyInputProtection();
    }

    function applyInputProtection() {
        document.querySelectorAll('.target-input').forEach(input => { input.readOnly = useCustomKB; });
    }

    document.addEventListener('click', (e) => {
        if(e.target.classList.contains('target-input')) { showKeyboard(e.target); } 
        else if(!e.target.closest('#custom-keyboard')) { hideKeyboard(); }
    });

    // --- DATA MANAGEMENT ---
    function saveData(showAlert = false) {
        const data = [];
        document.querySelectorAll('.section-card').forEach(sec => {
            const timeMarks = [];
            sec.querySelectorAll('.time-badge').forEach(b => timeMarks.push(b.dataset.time));

            const answers = [];
            sec.querySelectorAll('.answer-row').forEach(row => {
                answers.push({
                    type: row.dataset.type,
                    text: row.querySelector('.answer-input').value,
                    mcqOpt: row.querySelector('.mcq-select').value,
                    mcqDesc: row.querySelector('.mcq-desc').value,
                    correct: row.dataset.correct,
                    correctOpt: row.querySelector('.mcq-correct-select').value,
                    correctDesc: row.querySelector('.mcq-correct-desc').value,
                    reason: row.querySelector('.reason-input').value
                });
            });
            data.push({ title: sec.querySelector('.section-title').value, timeMarks, answers });
        });
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
        
        if (showAlert) {
            Swal.fire({ position: 'top-end', icon: 'success', title: 'Progress Saved', showConfirmButton: false, timer: 1400 });
        }
    }

    function loadData() {
        const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (saved) {
            const data = JSON.parse(saved);
            if(data.length > 0) {
                document.getElementById('workspace').innerHTML = ''; sectionCount = 0;
                data.forEach(secData => {
                    const secDiv = addSection(secData.title, true);
                    if(secData.timeMarks) {
                        const btnMark = secDiv.querySelector('.time-marks-area button');
                        secData.timeMarks.forEach(t => addTimeMark(btnMark, t));
                    }
                    const btnAddAns = secDiv.querySelector('.answers-container').nextElementSibling;
                    secData.answers.forEach(ans => addAnswer(btnAddAns, ans));
                });
                currentSectionIndex = 0; updateSectionNav(); calculateScore(); renderKeyboard();
                restoreMediaMode();
                if (window.ByPdf) ByPdf.init();
                return;
            }
        }
        addSection(); renderKeyboard();
        restoreMediaMode();
        if (window.ByPdf) ByPdf.init();
    }

    window.onload = loadData;
</script>
