<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Writing - Task 1 (Premium Workspace)</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #4f46e5;         /* Premium Indigo */
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;        /* Soft slate background */
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        
        /* Menggunakan 100dvh agar pas sempurna di browser mobile */
        html, body { height: 100dvh; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; }
        
        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* --- Sticky Header --- */
        .sticky-zone { 
            flex-shrink: 0; background-color: var(--card-bg); padding: 12px 20px; 
            border-bottom: 1px solid var(--border); z-index: 100; display: flex; 
            justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm);
        }
        .header-title { font-size: 1.25rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px;}
        .top-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        
        /* --- Buttons --- */
        button { 
            display: inline-flex; align-items: center; justify-content: center; gap: 6px; 
            background: var(--primary); color: white; border: none; padding: 8px 16px; 
            border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; 
            transition: all 0.2s ease; box-shadow: var(--shadow-sm);
        }
        button svg { width: 18px; height: 18px; flex-shrink: 0; }
        button:hover { background: var(--primary-hover); transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        
        .btn-success { background: #10b981; } .btn-success:hover { background: #059669; }
        .btn-danger { background: #fff; border: 1px solid #ef4444; color: #ef4444; box-shadow: none;} 
        .btn-danger:hover { background: #fef2f2; border-color:#dc2626; color: #dc2626;}
        .btn-back { background: #f1f5f9; color: var(--text-main); box-shadow: none; border: 1px solid var(--border);} 
        .btn-back:hover { background: #e2e8f0; }

        /* --- Main Workspace --- */
        .main-workspace { display: flex; flex-direction: column; flex-grow: 1; overflow-y: auto; }
        .panel { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        /* Desktop Split View */
        @media (min-width: 992px) {
            .main-workspace { flex-direction: row; overflow: hidden; }
            .panel { overflow-y: auto; height: 100%; }
            .panel.left { flex: 0 0 42%; border-right: 1px solid var(--border); background: var(--bg-color); }
            .panel.right { flex: 0 0 58%; background: #ffffff; }
        }

        /* --- Cards --- */
        .card { 
            background: var(--card-bg); padding: 20px; border-radius: 12px; 
            border: 1px solid var(--border); box-shadow: var(--shadow-md); 
            display: flex; flex-direction: column;
        }
        .card-title { 
            font-weight: 700; margin-bottom: 12px; color: var(--text-main); 
            display: flex; justify-content: space-between; align-items: center; font-size: 15px;
        }
        
        /* --- Inputs --- */
        .input-full { 
            width: 100%; padding: 12px 15px; border: 1px solid var(--border); 
            border-radius: 8px; font-size: 15px; resize: vertical; outline: none; 
            background: #f8fafc; color: var(--text-main); line-height: 1.5; transition: all 0.2s;
        }
        .input-full:focus { 
            background: #ffffff; border-color: var(--primary); 
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); 
        }
        
        /* --- Image Uploader --- */
        .img-preview-box { 
            width: 100%; min-height: 220px; border: 2px dashed #cbd5e1; 
            border-radius: 12px; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; overflow: hidden; position: relative; 
            background: #f1f5f9; margin-bottom: 15px; transition: 0.2s;
        }
        .img-preview-box:hover { border-color: var(--primary); background: #f8fafc; }
        .img-preview-box img { max-width: 100%; max-height: 350px; object-fit: contain; display: none; z-index: 5; background: white;}
        
        .upload-content { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); gap: 8px; pointer-events: none; }
        .upload-content svg { width: 40px; height: 40px; color: #94a3b8; }
        .upload-content span { font-size: 14px; font-weight: 500; }
        
        input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; width: 100%; z-index: 10; }

        /* --- Word Counter --- */
        .word-count-badge { font-size: 12px; font-weight: 600; background: #f1f5f9; color: var(--text-muted); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border);}
        .total-words { font-size: 16px; font-weight: 700; padding: 10px; text-align: right; color: var(--text-muted); }
        .target-met { color: #10b981; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .header-title { display: none; } /* Hide title on very small screens to fit buttons */
            .panel { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="sticky-zone">
        <a href="../index.html" style="text-decoration: none;">
            <button class="btn-back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg> 
                Back
            </button>
        </a>
        <div class="header-title">Writing Task 1</div>
        <div class="top-actions">
            <button class="btn-danger" onclick="clearData()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
            <button class="btn-success" onclick="saveData(true)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> 
                Save
            </button>
            <button onclick="printSheet()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg> 
                Print Sheet
            </button>
        </div>
    </div>

    <div class="main-workspace">
        <!-- Left Panel: Question & Image -->
        <div class="panel left">
            <div class="card">
                <div class="card-title">Upload Graph / Diagram</div>
                <div class="img-preview-box" id="img-box">
                    <div class="upload-content" id="upload-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        <span>Click or Tap to upload image</span>
                    </div>
                    <input type="file" id="image-upload" accept="image/*" onchange="previewImage(event)">
                    <img id="image-preview" src="" alt="Graph">
                </div>
                <button class="btn-danger" id="btn-remove-img" style="display:none; width: 100%; margin-top: 10px;" onclick="removeImage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    Remove Image
                </button>
            </div>

            <div class="card" style="flex-grow: 1;">
                <div class="card-title">Question Prompt</div>
                <textarea id="question-prompt" class="input-full" style="flex-grow: 1; min-height: 150px;" placeholder="Type or paste the task 1 prompt here..." oninput="saveData()"></textarea>
            </div>
        </div>

        <!-- Right Panel: Writing Workspace -->
        <div class="panel right">
            <div class="total-words" id="total-word-count">Total Words: 0 / 150</div>
            
            <div class="card">
                <div class="card-title">
                    Introduction
                    <span class="word-count-badge" id="wc-intro">0 words</span>
                </div>
                <textarea id="p-intro" class="input-full paragraph-input" rows="4" placeholder="Paraphrase the prompt here..." oninput="updateWords()"></textarea>
            </div>

            <div class="card">
                <div class="card-title">
                    Overview (or Conclusion)
                    <span class="word-count-badge" id="wc-overview">0 words</span>
                </div>
                <textarea id="p-overview" class="input-full paragraph-input" rows="4" placeholder="Summarize the main trends or key differences..." oninput="updateWords()"></textarea>
            </div>

            <div class="card">
                <div class="card-title">
                    Body Paragraph 1
                    <span class="word-count-badge" id="wc-detail1">0 words</span>
                </div>
                <textarea id="p-detail1" class="input-full paragraph-input" rows="6" placeholder="Group and support detailed data..." oninput="updateWords()"></textarea>
            </div>

            <div class="card">
                <div class="card-title">
                    Body Paragraph 2
                    <span class="word-count-badge" id="wc-detail2">0 words</span>
                </div>
                <textarea id="p-detail2" class="input-full paragraph-input" rows="6" placeholder="Group and support detailed data..." oninput="updateWords()"></textarea>
            </div>
        </div>
    </div>

    <script>
        // Key untuk UI Editor
        const WORKSPACE_KEY = 'ielts_writing_task1_workspace';
        // Key yang dibaca oleh halaman Print Sheet Anda
        const PRINT_KEY = 'ielts_writing_task1_pro';

        function countWords(str) {
            return str.trim().split(/\s+/).filter(word => word.length > 0).length;
        }

        function updateWords() {
            let total = 0;
            const ids = ['intro', 'overview', 'detail1', 'detail2'];
            
            ids.forEach(id => {
                const text = document.getElementById(`p-${id}`).value;
                const wc = countWords(text);
                document.getElementById(`wc-${id}`).innerText = `${wc} words`;
                total += wc;
            });

            const totalEl = document.getElementById('total-word-count');
            totalEl.innerText = `Total Words: ${total} / 150`;
            if (total >= 150) totalEl.classList.add('target-met');
            else totalEl.classList.remove('target-met');
            
            saveData(false);
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgPreview = document.getElementById('image-preview');
                    imgPreview.src = e.target.result;
                    imgPreview.style.display = 'block';
                    document.getElementById('upload-wrapper').style.display = 'none';
                    document.getElementById('btn-remove-img').style.display = 'flex';
                    saveData(false);
                }
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            document.getElementById('image-preview').src = '';
            document.getElementById('image-preview').style.display = 'none';
            document.getElementById('upload-wrapper').style.display = 'flex';
            document.getElementById('btn-remove-img').style.display = 'none';
            document.getElementById('image-upload').value = '';
            saveData(false);
        }

        function saveData(showAlert = false) {
            const data = {
                image: document.getElementById('image-preview').src,
                question: document.getElementById('question-prompt').value,
                intro: document.getElementById('p-intro').value,
                overview: document.getElementById('p-overview').value,
                detail1: document.getElementById('p-detail1').value,
                detail2: document.getElementById('p-detail2').value
            };

            // Gabungkan paragraf untuk dikirim ke Halaman Print
            // Menggunakan 2 Enter (\n\n) untuk membedakan paragraf di lembar jawaban
            const combinedEssay = `${data.intro}\n\n${data.overview}\n\n${data.detail1}\n\n${data.detail2}`.replace(/\n{3,}/g, '\n\n').trim();

            try {
                // Simpan UI Editor
                localStorage.setItem(WORKSPACE_KEY, JSON.stringify(data));
                // Simpan Teks Mentah untuk Print Lembar LJK
                localStorage.setItem(PRINT_KEY, combinedEssay);
                
                if (showAlert) Swal.fire({ position: 'top-end', icon: 'success', title: 'Saved!', showConfirmButton: false, timer: 1000 });
            } catch(e) {
                if (showAlert) Swal.fire('Error', 'Image size is too large to save in local storage. Try a smaller image.', 'error');
            }
        }

        function loadData() {
            const saved = localStorage.getItem(WORKSPACE_KEY);
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('question-prompt').value = data.question || "";
                document.getElementById('p-intro').value = data.intro || "";
                document.getElementById('p-overview').value = data.overview || "";
                document.getElementById('p-detail1').value = data.detail1 || "";
                document.getElementById('p-detail2').value = data.detail2 || "";
                
                if (data.image && data.image.length > 10) {
                    document.getElementById('image-preview').src = data.image;
                    document.getElementById('image-preview').style.display = 'block';
                    document.getElementById('upload-wrapper').style.display = 'none';
                    document.getElementById('btn-remove-img').style.display = 'flex';
                }
                updateWords();
            }
        }

        function clearData() {
            Swal.fire({ title: 'Are you sure?', text: "This will reset all your writing!", icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem(WORKSPACE_KEY);
                    localStorage.removeItem(PRINT_KEY);
                    document.getElementById('question-prompt').value = "";
                    document.querySelectorAll('.paragraph-input').forEach(el => el.value = "");
                    removeImage();
                    updateWords();
                    Swal.fire('Cleared!', 'Workspace has been reset.', 'success');
                }
            });
        }

        function printSheet() {
            // Memastikan data disave dulu sebelum diprint
            saveData(false);
            
            // Path diarahkan ke file lembar print (Mundur 3 folder ke root, lalu masuk folder print)
            const printPath = '../../../print/writing/task1/index.html'; 
            window.open(printPath, '_blank');
        }

        window.onload = loadData;
    </script>
</body>
</html>
