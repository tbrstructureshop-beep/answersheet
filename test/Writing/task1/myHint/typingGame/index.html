<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Handwritten Retype Practice - Band 9</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@300;400;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --paper-bg: #fefcf3;
            --line-color: #e5dfd3;
            --margin-line: #fca5a5;
            --ink-blue: #1e3a8a;
            --ink-ghost: rgba(30, 58, 138, 0.25);
            --ink-error: #ef4444;
            --primary: #4f46e5;
            --kb-bg: #e2e8f0;
            --key-bg: #ffffff;
            --key-active: #cbd5e1;
            --key-text: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: #ede8dc;
            font-family: 'Kalam', cursive;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            color: #1e293b;
            padding-bottom: 20px;
            user-select: none;
        }

        body.has-osk {
            padding-bottom: 270px;
        }

        /* Top Bar */
        .top-nav {
            background: #ffffff;
            border-bottom: 2px dashed #d1c7b7;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Inter', sans-serif;
            z-index: 100;
            position: sticky;
            top: 0;
            gap: 8px;
            flex-wrap: wrap;
        }
        .top-nav .title-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 14px;
            color: #4338ca;
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            border: 1px solid #cbd5e1;
            background: #fff;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            color: #334155;
        }
        .btn-action:hover { background: #f8fafc; border-color: #94a3b8; }
        .btn-peek {
            background: #fef08a;
            border-color: #facc15;
            color: #854d0e;
        }
        .btn-peek:hover { background: #fde047; }

        /* Keyboard & Sound Toggle Pill */
        .btn-toggle-kb, .btn-toggle-sound {
            background: #f1f5f9;
            border-color: #cbd5e1;
            color: #475569;
        }
        .btn-toggle-kb.active, .btn-toggle-sound.active {
            background: #4f46e5;
            border-color: #4338ca;
            color: #ffffff;
        }

        /* Sound Select Dropdown */
        .sound-select-styled {
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            outline: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: 0.15s;
        }
        .sound-select-styled:focus {
            border-color: #4f46e5;
        }
        .sound-select-styled:disabled {
            background: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .coin-pill {
            background: #fffbeb;
            border: 1px solid #fde68a;
            color: #b45309;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Handwritten Desk Layout */
        .desk-workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 16px 12px;
        }

        /* Notebook Paper Style */
        .notebook-paper {
            width: 100%;
            max-width: 860px;
            background: var(--paper-bg);
            border-radius: 6px;
            box-shadow: 2px 3px 20px rgba(0, 0, 0, 0.08), 0 0 0 1px #e2dac9;
            padding: 30px 24px 50px 54px;
            position: relative;
            background-image: repeating-linear-gradient(var(--paper-bg) 0px, var(--paper-bg) 31px, var(--line-color) 32px);
            line-height: 32px;
        }

        /* Red margin line */
        .notebook-paper::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 40px;
            width: 2px;
            background-color: var(--margin-line);
        }

        /* Stats Sub-bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-family: 'Inter', sans-serif;
            font-size: 12.5px;
            color: #64748b;
            margin-bottom: 16px;
            border-bottom: 1px solid #e2dac9;
            padding-bottom: 8px;
        }

        /* Typing Area Engine */
        .typing-container {
            position: relative;
            min-height: 280px;
            cursor: text;
        }

        /* Ghost & Typed Layer */
        .display-stream {
            font-family: 'Caveat', cursive;
            font-size: 26px;
            letter-spacing: 0.5px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 32px;
            user-select: none;
            pointer-events: none;
        }

        .char-typed {
            color: var(--ink-blue);
            font-weight: 700;
        }
        .char-ghost {
            color: var(--ink-ghost);
            font-weight: 600;
        }
        .char-error {
            color: var(--ink-error);
            background: #fee2e2;
            border-radius: 2px;
            text-decoration: underline wavy #ef4444;
        }
        .caret {
            border-left: 3px solid #ef4444;
            animation: blink 0.9s infinite;
            margin-left: -1px;
            margin-right: -1px;
            display: inline-block;
            height: 24px;
            vertical-align: middle;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Hidden functional input */
        #hidden-input {
            position: absolute;
            left: -9999px;
            top: -9999px;
            opacity: 0;
            width: 1px;
            height: 1px;
        }

        /* Peek Modal for Graph Diagram */
        .peek-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            z-index: 2500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .peek-modal {
            background: #fff;
            padding: 14px;
            border-radius: 12px;
            max-width: 92vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
        }
        .peek-modal img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .peek-footer {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }

        /* Floating Peek Image Button */
        .fab-peek {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #fbbf24;
            color: #78350f;
            border-radius: 50%;
            border: none;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.2s;
        }
        .fab-peek:hover { transform: scale(1.08); background: #f59e0b; color: #fff; }
        .fab-peek svg { width: 24px; height: 24px; stroke: currentColor; fill: none; }

        /* ON-SCREEN QWERTY KEYBOARD (FULL) */
        .osk-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #cbd5e1;
            padding: 8px 6px 12px 6px;
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.15);
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 1500;
            font-family: 'Inter', system-ui, sans-serif;
            border-top: 1px solid #94a3b8;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 12px 12px 0 0;
        }
        .osk-container.visible {
            display: flex;
        }

        .osk-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }

        .osk-key {
            flex: 1;
            max-width: 54px;
            height: 42px;
            background: #ffffff;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 0 #94a3b8;
            touch-action: manipulation;
            user-select: none;
            transition: all 0.08s ease;
        }
        .osk-key:active, .osk-key.pressed {
            transform: translateY(2px);
            box-shadow: 0 0 0 #94a3b8;
            background: #e2e8f0;
        }

        .osk-key.special {
            background: #94a3b8;
            color: #ffffff;
            font-size: 12.5px;
            font-weight: 700;
            max-width: 76px;
        }
        .osk-key.special.active {
            background: #4f46e5;
            color: #ffffff;
            border-color: #3730a3;
        }
        .osk-key.space {
            flex: 4;
            max-width: 260px;
        }
        .osk-key.enter {
            flex: 1.5;
            max-width: 80px;
            background: #10b981;
            color: white;
            border-color: #059669;
            box-shadow: 0 2px 0 #059669;
        }
        .osk-key.enter:active {
            box-shadow: 0 0 0 #059669;
        }

        /* Reward Modal */
        .reward-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reward-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            font-family: 'Inter', sans-serif;
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .coin-icon-huge {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            filter: drop-shadow(0 4px 6px rgba(245, 158, 11, 0.3));
        }

        /* Mobile adjustments */
        @media (max-width: 640px) {
            .notebook-paper { padding: 24px 12px 40px 36px; }
            .notebook-paper::before { left: 24px; }
            .display-stream { font-size: 21px; line-height: 32px; }
            .osk-key { height: 38px; font-size: 13.5px; }
            .fab-peek { bottom: 15px; right: 15px; }
            body.has-osk { padding-bottom: 240px; }
        }
    </style>
</head>
<body onclick="handleDeskClick()">

    <!-- Top Navigation -->
    <div class="top-nav">
        <div class="title-group">
            <a href="../index.html" class="btn-action" title="Back to Hints">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>

            </a>
            <span>✍️ Handwritten Retype</span>
        </div>

        <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">

                <svg width="16" height="16" viewBox="0 0 24 24" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v12M15 9.5H9.5a2.5 2.5 0 0 1 0-5H12"></path></svg>

            <!-- Sound Toggle Button -->

                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                <span id="toggle-sound-text">Sound: ON</span>
            </button>

            <!-- Sound Effect Selector Dropdown -->
            <select id="sound-select" class="sound-select-styled" onchange="changeSoundType(event)">
                <option value="typewriter">Typewriter</option>
                <option value="pencil">Pencil</option>
                <option value="chalk">Chalk</option>
                <option value="dippen">Dip Pen</option>
            </select>

            <!-- Toggle Button for On-Screen Keyboard -->
            <button id="toggle-osk-btn" class="btn-action btn-toggle-kb" onclick="toggleOSK(event)" title="Toggle On-Screen Keyboard">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="6" y1="8" x2="6" y2="8"></line><line x1="10" y1="8" x2="10" y2="8"></line><line x1="14" y1="8" x2="14" y2="8"></line><line x1="18" y1="8" x2="18" y2="8"></line><line x1="6" y1="12" x2="6" y2="12"></line><line x1="10" y1="12" x2="10" y2="12"></line><line x1="14" y1="12" x2="14" y2="12"></line><line x1="18" y1="12" x2="18" y2="12"></line><line x1="7" y1="16" x2="17" y2="16"></line></svg>
                <span id="toggle-osk-text">Keyboard: OFF</span>

            <button class="btn-action btn-peek" onclick="openPeekModal(event)">

                Peek

    <!-- Main Desk -->

            <div class="stats-bar">

            <!-- The Typing Canvas Layer -->

            </div>

    <!-- Hidden input to capture physical keyboard / software keyboard on devices -->

    <!-- Floating Quick-Peek Button -->

            <circle cx="12" cy="12" r="3"></circle>

    <!-- ON-SCREEN FULL QWERTY KEYBOARD -->

            <button type="button" class="osk-key" data-key="e">e</button>
            <button type="button" class="osk-key" data-key="r">r</button>
            <button type="button" class="osk-key" data-key="t">t</button>
            <button type="button" class="osk-key" data-key="y">y</button>
            <button type="button" class="osk-key" data-key="u">u</button>
            <button type="button" class="osk-key" data-key="i">i</button>
            <button type="button" class="osk-key" data-key="o">o</button>

        <!-- Row 3: ASDFGH -->

            <button type="button" class="osk-key" data-key="/">/</button>

    <!-- Peek Image Modal -->
    <div class="peek-overlay" id="peek-overlay" onclick="closePeekModal(event)">

            <img id="peek-img" src="" alt="Graph Diagram">
            <div class="peek-footer">
                <span style="color: #64748b;">Click outside or Esc to close & continue typing</span>
                <button class="btn-action" onclick="closePeekModal()">Close</button>

        </div>

    <script>
        const STORAGE_HINT_KEY = 'ielts_writing_task1_ai_hint';
        const STORAGE_WORKSPACE_KEY = 'ielts_writing_task1_workspace';
        const STORAGE_COIN_KEY = 'ielts_user_gold_coins';
        const STORAGE_OSK_KEY = 'ielts_retype_osk_enabled';
        const STORAGE_SOUND_ENABLED_KEY = 'ielts_retype_sound_enabled';
        const STORAGE_SOUND_TYPE_KEY = 'ielts_retype_sound_type';

        let targetText = "";
        let currentIndex = 0;
        let errorsCount = 0;
        let totalTypedCount = 0;
        let isCompleted = false;

        let isShiftActive = false;
        let isOSKVisible = false;

        // Sound System (Web Audio API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let isSoundEnabled = true;
        let selectedSound = 'typewriter';

        function createNoiseBuffer(durationSec) {
            const bufferSize = audioCtx.sampleRate * durationSec;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            return buffer;
        }

        function playTypewriter() {
            const buffer = createNoiseBuffer(0.03);
            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1000 + Math.random() * 400;

            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);

            whiteNoise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            whiteNoise.start();
        }

        function playPencil() {
            const buffer = createNoiseBuffer(0.05);
            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 3000 + Math.random() * 800;

            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

            whiteNoise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            whiteNoise.start();
        }

        function playChalk() {
            const buffer = createNoiseBuffer(0.04);
            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 800 + Math.random() * 300;
            filter.Q.value = 2.0;

            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

            whiteNoise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            whiteNoise.start();
        }

        function playDipPen() {
            const buffer = createNoiseBuffer(0.03);
            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 5500 + Math.random() * 1000;

            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);

            whiteNoise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            whiteNoise.start();
        }

        function playTypingSound() {
            if (!isSoundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                switch (selectedSound) {
                    case 'typewriter': playTypewriter(); break;
                    case 'pencil': playPencil(); break;
                    case 'chalk': playChalk(); break;
                    case 'dippen': playDipPen(); break;
                }
            } catch(e) {}
        }

        function toggleSound(e) {
            if (e) e.stopPropagation();
            setSoundState(!isSoundEnabled);
            if (isSoundEnabled) playTypingSound();
        }

        function setSoundState(enabled) {
            isSoundEnabled = enabled;
            localStorage.setItem(STORAGE_SOUND_ENABLED_KEY, enabled ? 'true' : 'false');

            const btn = document.getElementById('toggle-sound-btn');
            const text = document.getElementById('toggle-sound-text');
            const select = document.getElementById('sound-select');

            if (enabled) {
                btn.classList.add('active');
                text.innerText = "Sound: ON";
                select.disabled = false;
            } else {
                btn.classList.remove('active');
                text.innerText = "Sound: OFF";
                select.disabled = true;
            }
        }

        function changeSoundType(e) {
            selectedSound = e.target.value;
            localStorage.setItem(STORAGE_SOUND_TYPE_KEY, selectedSound);
            playTypingSound();
            focusInput();
        }

        function loadSoundPreferences() {
            const savedEnabled = localStorage.getItem(STORAGE_SOUND_ENABLED_KEY);
            if (savedEnabled !== null) {
                setSoundState(savedEnabled === 'true');
            } else {
                setSoundState(true);
            }

            const savedType = localStorage.getItem(STORAGE_SOUND_TYPE_KEY);
            if (savedType) {
                selectedSound = savedType;
                const select = document.getElementById('sound-select');
                if (select) select.value = savedType;
            }
        }

        function loadCoins() {
            const coins = parseInt(localStorage.getItem(STORAGE_COIN_KEY) || "0", 10);
            document.getElementById('user-coins').innerText = coins;
        }

        function addCoins(amount) {
            let coins = parseInt(localStorage.getItem(STORAGE_COIN_KEY) || "0", 10);
            coins += amount;
            localStorage.setItem(STORAGE_COIN_KEY, coins);
            document.getElementById('user-coins').innerText = coins;
        }

        function loadModelAnswer() {
            const rawHint = localStorage.getItem(STORAGE_HINT_KEY);
            if (rawHint) {
                try {
                    const parsed = JSON.parse(rawHint);
                    targetText = (parsed.full || "").trim();
                } catch(e) {}
            }

            if (!targetText) {
                targetText = "Please go back to AI Hint and paste a Band 9 Model Answer first!";
            }

            renderDisplay();
            updateStats();
        }

        function renderDisplay() {
            const container = document.getElementById('text-display');
            container.innerHTML = "";

            const typedPart = targetText.slice(0, currentIndex);
            const remainingPart = targetText.slice(currentIndex);

            // Tinta biru tulisan tangan
            const typedSpan = document.createElement('span');
            typedSpan.className = 'char-typed';
            typedSpan.textContent = typedPart;

            // Caret kedip
            const caret = document.createElement('span');
            caret.className = 'caret';

            // Ghost text 25% opacity
            const ghostSpan = document.createElement('span');
            ghostSpan.className = 'char-ghost';
            ghostSpan.textContent = remainingPart;

            container.appendChild(typedSpan);
            if (!isCompleted) container.appendChild(caret);
            container.appendChild(ghostSpan);

            // Auto-scroll follow caret
            caret.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function updateStats() {
            const total = targetText.length;
            const progress = total > 0 ? Math.round((currentIndex / total) * 100) : 0;
            document.getElementById('progress-percent').innerText = `${progress}%`;
            document.getElementById('chars-remaining').innerText = `${total - currentIndex} chars`;

            const accuracy = totalTypedCount > 0 
                ? Math.max(0, Math.round(((totalTypedCount - errorsCount) / totalTypedCount) * 100))
                : 100;
            document.getElementById('accuracy-stat').innerText = `${accuracy}%`;
        }

        // Shared Typing Processor (Untuk Hardware & On-Screen Keyboard)
        function processInputChar(char) {
            if (isCompleted) return;

            totalTypedCount++;
            playTypingSound();

            const expectedChar = targetText[currentIndex];

            if (char === expectedChar) {
                currentIndex++;
                renderDisplay();
                updateStats();

                if (currentIndex >= targetText.length) {
                    finishGame();
                }
            } else {
                errorsCount++;
                updateStats();
                flashError();
            }
        }

        function processBackspace() {
            if (isCompleted) return;
            playTypingSound();
            if (currentIndex > 0) {
                currentIndex--;
                renderDisplay();
                updateStats();
            }
        }

        function flashError() {
            const paper = document.querySelector('.notebook-paper');
            paper.style.boxShadow = "0 0 0 3px #ef4444";
            setTimeout(() => {
                paper.style.boxShadow = "2px 3px 20px rgba(0, 0, 0, 0.08), 0 0 0 1px #e2dac9";
            }, 180);
        }

        function finishGame() {
            isCompleted = true;
            renderDisplay();
            addCoins(100);

            try {
                confetti({ particleCount: 130, spread: 85, origin: { y: 0.6 } });
            } catch(e) {}

            document.getElementById('reward-overlay').style.display = 'flex';
        }

        function restartRetype() {
            currentIndex = 0;
            errorsCount = 0;
            totalTypedCount = 0;
            isCompleted = false;
            document.getElementById('reward-overlay').style.display = 'none';
            renderDisplay();
            updateStats();
            focusInput();
        }

        function focusInput() {
            if (!isOSKVisible) {
                document.getElementById('hidden-input').focus();
            }
        }

        function handleDeskClick() {
            focusInput();
        }

        // Hardware Keyboard Listener
        window.addEventListener('keydown', (e) => {
            if (isCompleted) return;

            if (e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') return;

            if (e.key === 'Escape') {
                closePeekModal();
                return;
            }

            if (e.key === 'Backspace') {
                processBackspace();
                e.preventDefault();
                return;
            }

            let key = e.key;
            if (key === 'Enter') key = '\n';

            if (key.length === 1 || key === '\n') {
                processInputChar(key);
                e.preventDefault();
            }
        });

        // ON-SCREEN KEYBOARD LOGIC
        function initOSK() {
            const osk = document.getElementById('osk-keyboard');
            
            osk.addEventListener('click', (e) => {
                e.stopPropagation();
                const keyBtn = e.target.closest('.osk-key');
                if (!keyBtn) return;

                const action = keyBtn.getAttribute('data-action');
                let char = keyBtn.getAttribute('data-key');

                if (action === 'backspace') {
                    processBackspace();
                    return;
                }

                if (action === 'enter') {
                    processInputChar('\n');
                    return;
                }

                if (action === 'shift') {
                    toggleShift();
                    return;
                }

                if (char) {
                    if (isShiftActive && /^[a-z]$/i.test(char)) {
                        char = char.toUpperCase();
                        toggleShift(false); // Reset shift after single char
                    }
                    processInputChar(char);
                }
            });

            // Load saved preference
            const savedState = localStorage.getItem(STORAGE_OSK_KEY);
            if (savedState === 'true') {
                setOSKState(true);
            } else {
                setOSKState(false);
            }
        }

        function toggleOSK(e) {
            if (e) e.stopPropagation();
            setOSKState(!isOSKVisible);
        }

        function setOSKState(visible) {
            isOSKVisible = visible;
            localStorage.setItem(STORAGE_OSK_KEY, visible ? 'true' : 'false');

            const osk = document.getElementById('osk-keyboard');
            const btn = document.getElementById('toggle-osk-btn');
            const text = document.getElementById('toggle-osk-text');

            if (visible) {
                osk.classList.add('visible');
                btn.classList.add('active');
                text.innerText = "Keyboard: ON";
                document.body.classList.add('has-osk');
            } else {
                osk.classList.remove('visible');
                btn.classList.remove('active');
                text.innerText = "Keyboard: OFF";
                document.body.classList.remove('has-osk');
                focusInput();
            }
        }

        function toggleShift(forcedState) {
            isShiftActive = forcedState !== undefined ? forcedState : !isShiftActive;
            const shiftBtn = document.getElementById('osk-shift-btn');
            shiftBtn.classList.toggle('active', isShiftActive);

            // Update on-screen letters display (Caps/Lower)
            const letterKeys = document.querySelectorAll('.osk-key[data-key]');
            letterKeys.forEach(k => {
                const raw = k.getAttribute('data-key');
                if (/^[a-zA-Z]$/.test(raw)) {
                    k.textContent = isShiftActive ? raw.toUpperCase() : raw.toLowerCase();
                }
            });
        }

        // Peek Modal Handler
        function openPeekModal(e) {
            if (e) e.stopPropagation();
            const rawWorkspace = localStorage.getItem(STORAGE_WORKSPACE_KEY);
            let imgSrc = "";
            if (rawWorkspace) {
                try {
                    const parsed = JSON.parse(rawWorkspace);
                    imgSrc = parsed.image || "";
                } catch(e) {}
            }

            const imgEl = document.getElementById('peek-img');
            if (imgSrc && imgSrc.length > 20) {
                imgEl.src = imgSrc;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
                alert("No image uploaded yet in Writing Workspace!");
                return;
            }
            document.getElementById('peek-overlay').style.display = 'flex';
        }

        function closePeekModal(e) {
            if (e) e.stopPropagation();
            document.getElementById('peek-overlay').style.display = 'none';
            focusInput();
        }

        window.onload = () => {
            loadCoins();
            loadModelAnswer();
            loadSoundPreferences();
            initOSK();
            focusInput();
        };
    </script>
</body>
</html>
