<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Writing Practice Pro</title>
    <style>
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9; --card-bg: #ffffff; --border: #e2e8f0;
            --text-main: #1e293b; --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2rem; color: var(--primary); margin-bottom: 10px; }
        .header p { color: var(--text-muted); font-size: 1.1rem; }

        .cards-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 800px; width: 100%; }
        
        .task-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
            padding: 30px; flex: 1; min-width: 300px; text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; color: inherit;
        }
        .task-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-color: var(--primary); }
        
        .task-icon { width: 60px; height: 60px; background: #eff6ff; color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .task-icon svg { width: 30px; height: 30px; }
        
        .task-card h2 { font-size: 1.5rem; margin-bottom: 10px; }
        .task-card p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }
        
        .btn-start { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 1rem; width: 100%; transition: 0.2s; }
        .task-card:hover .btn-start { background: var(--primary-hover); }
    </style>
</head>
<body>

    <div class="header">
        <h1>IELTS Writing Practice Pro</h1>
        <p>Choose your module to start practicing</p>
    </div>

    <div class="cards-container">
        <!-- Task 1 Card -->
        <a href="./task1/index.html" class="task-card">
            <div class="task-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            </div>
            <h2>Task 1 (Report)</h2>
            <p>Upload a graph/diagram and write your 150-word report. Includes Intro, Overview, and Details.</p>
            <button class="btn-start">Start Task 1</button>
        </a>

        <!-- Task 2 Card -->
        <a href="./task2/index.html" class="task-card">
            <div class="task-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </div>
            <h2>Task 2 (Essay)</h2>
            <p>Write your 250-word discursive essay. Includes Introduction, Body Paragraphs, and Conclusion.</p>
            <button class="btn-start">Start Task 2</button>
        </a>
    </div>

</body>
</html>
