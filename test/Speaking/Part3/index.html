<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Part 3 - Practice</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #2563eb; --bg-color: #f1f5f9; --card-bg: #ffffff; --border: #e2e8f0; --text-main: #1e293b; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        html, body { height: 100%; display: flex; flex-direction: column; background: var(--bg-color); color: var(--text-main); overflow: hidden;}
        
        .sticky-header { padding: 15px 20px; background: var(--card-bg); border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100; flex-shrink: 0;}
        .btn { padding: 8px 14px; border: none; border-radius: 6px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: white; background: var(--primary); }
        .btn-back { background: #64748b; }
        .btn-danger { background: var(--danger); }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: #eff6ff; }
        
        .main-workspace { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }
        @media (min-width: 800px) { .main-workspace { flex-direction: row; } }
        
        /* Video Panel */
        .video-panel { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 2px solid var(--border); overflow-y: auto; background: #0f172a;}
        .video-container { flex: 1; background: #000; border-radius: 12px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 300px;}
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .timer { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); color: white; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-family: monospace; font-size: 1.2rem;}
        .timer.recording { color: #fca5a5; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .cam-controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;}
        .cam-controls .btn { flex: 1; min-width: 120px; justify-content: center; }

        /* Questions Panel */
        .q-panel { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: var(--bg-color); }
        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        
        .q-card { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border); display: flex; gap: 10px; }
        .q-card textarea { flex: 1; border: none; outline: none; resize: none; font-size: 15px; min-height: 50px; }
        .q-card textarea:focus { border-bottom: 2px solid var(--primary); }
    </style>
</head>
<body>

    <div class="sticky-header">
        <button class="btn btn-back" onclick="window.location.href='../index.html'">⬅ Back</button>
        <h2 style="font-size: 1.2rem;">Part 3 (Discussion)</h2>
        <button class="btn btn-outline" onclick="saveQuestions()">💾 Save Qs</button>
    </div>

    <div class="main-workspace">
        <!-- Perekam Video -->
        <div class="video-panel">
            <div class="video-container">
                <div class="timer" id="timerDisplay">00:00</div>
                <video id="liveVideo" autoplay muted playsinline></video>
                <video id="playbackVideo" controls style="display:none;"></video>
            </div>
            
            <div class="cam-controls">
                <button class="btn" id="btnSwitchCam" onclick="switchCamera()">🔄 Switch Cam</button>
                <button class="btn btn-danger" id="btnRecord" onclick="toggleRecording()">🔴 Start Record</button>
                <button class="btn btn-outline" id="btnDownload" onclick="downloadVideo()" style="display:none; color: white; border-color: white;">⬇ Download Video</button>
            </div>
        </div>

        <!-- Daftar Pertanyaan -->
        <div class="q-panel">
            <div class="q-header">
                <h3>Follow-up Questions</h3>
                <button class="btn" onclick="addQuestion()">➕ Add Question</button>
            </div>
            <div id="q-list"></div>
        </div>
    </div>
