<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Speaking Part 1 - Practice & Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { 
            --primary: #2563eb; 
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc; 
            --card-bg: #ffffff; 
            --border: #e2e8f0; 
            --text-main: #0f172a; 
            --text-muted: #64748b;
            --danger: #ef4444; 
            --success: #10b981;
            --warning: #f59e0b;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; display: flex; flex-direction: column; background: var(--bg-color); color: var(--text-main); overflow: hidden; }
        
        .icon { width: 18px; height: 18px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
        
        /* Header */
        .sticky-header { padding: 12px 24px; background: var(--card-bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100; flex-shrink: 0; }
        .header-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; }
        .badge { font-size: 0.75rem; background: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
        
        /* Buttons */
        .btn { padding: 8px 14px; border: none; border-radius: 6px; font-weight: 500; font-size: 0.875rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; color: white; background: var(--primary); transition: all 0.2s; }
        .btn:hover { opacity: 0.95; }
        .btn-danger { background: var(--danger); }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: #f1f5f9; }
        .btn-icon { padding: 6px; border-radius: 6px; border: 1px solid var(--border); background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--text-muted); transition: all 0.15s; }
        .btn-icon:hover { color: var(--text-main); background: #f1f5f9; border-color: #cbd5e1; }
        .btn-hint { color: #d97706; background: #fef3c7; border-color: #fde68a; }
        .btn-hint:hover { background: #fde68a; color: #b45309; }

        /* Workspace */
        .main-workspace { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }
        @media (min-width: 900px) { .main-workspace { flex-direction: row; } }
        
        /* Video Panel */
        .video-panel { flex: 1.1; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid var(--border); overflow-y: auto; background: #0b1120; }
        .video-container { flex: 1; background: #000; border-radius: 12px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 320px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .timer { position: absolute; top: 16px; right: 16px; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px); color: white; padding: 4px 12px; border-radius: 20px; font-family: monospace; font-size: 1.1rem; border: 1px solid rgba(255,255,255,0.1); }
        .timer.recording { color: #f87171; border-color: #ef4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .cam-controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        
        /* Questions Panel */
        .q-panel { flex: 1.4; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background: var(--bg-color); }
        .topic-selector-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
        .topic-selector-card label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: var(--text-muted); }
        .select-field { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.9rem; background: var(--card-bg); color: var(--text-main); outline: none; }
        
        .q-list { display: flex; flex-direction: column; gap: 12px; }
        .q-card { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        
        .q-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .q-title { font-weight: 600; font-size: 0.95rem; line-height: 1.4; color: var(--text-main); flex: 1; }
        .q-actions { display: flex; gap: 6px; }

        .draft-container { position: relative; width: 100%; }
        .answer-draft { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 0.95rem; resize: vertical; min-height: 80px; line-height: 1.6; color: var(--text-main); background: #ffffff; }
        .answer-draft:focus { outline: none; border-color: var(--primary); }

        /* Karaoke Teleprompter Display */
        .karaoke-display { 
            display: none; 
            width: 100%; 
            min-height: 80px; 
            border: 2px solid #bfdbfe; 
            background: #f0f7ff; 
            border-radius: 6px; 
            padding: 12px; 
            font-size: 1.05rem; 
            line-height: 1.8; 
            user-select: none;
            overflow-y: auto;
            max-height: 220px;
        }
        .karaoke-word { 
            color: #94a3b8; 
            transition: all 0.15s ease; 
            display: inline-block; 
            margin: 0 2px; 
            border-radius: 4px;
            padding: 0 3px;
            cursor: pointer;
        }
        .karaoke-word:hover {
            background-color: #e2e8f0;
            color: #1e293b;
        }

        /* Kata yang diucapkan user dengan benar */
        .karaoke-word.hit { 
            color: #1d4ed8 !important; 
            background-color: #dbeafe; 
            font-weight: 700; 
            transform: scale(1.05); 
        }

        /* Kata yang sedang dibacakan oleh Natural TTS */
        .karaoke-word.reading {
            color: #b45309 !important;
            background-color: #fef3c7 !important;
            font-weight: 700;
            transform: scale(1.08);
            box-shadow: 0 0 0 1px #fde68a;
        }

        .practice-zone { 
            background: #f8fafc; 
            border: 1px dashed var(--border); 
            border-radius: 8px; 
            padding: 10px 12px; 
            font-size: 0.85rem; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        
        .practice-actions { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            flex-wrap: wrap;
            gap: 8px;
        }

        .action-buttons-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Slider Kecepatan Membaca Alami */
        .tts-speed-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .tts-speed-bar input[type=range] {
            flex: 1;
            height: 5px;
            background: #e2e8f0;
            border-radius: 4px;
            outline: none;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .speed-val-badge {
            color: var(--primary);
            font-weight: 700;
            min-width: 45px;
            text-align: right;
        }

        .speech-result { 
            min-height: 24px; 
            font-size: 0.85rem; 
            line-height: 1.5; 
            color: var(--text-muted); 
            word-break: break-word;
        }
        .accuracy-pill { font-size: 0.75rem; padding: 3px 10px; border-radius: 999px; background: #e0e7ff; color: #1e40af; font-weight: bold; border: 1px solid #c7d2fe; }
    </style>
</head>
<body>

    <div class="sticky-header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <button class="btn btn-outline" onclick="window.location.href='../index.html'">
                <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
                <span>Back</span>
            </button>
            <div class="header-title">
                <span>Speaking Part 1 Studio</span>
                <span class="badge">Natural Voice & Karaoke</span>
            </div>
        </div>
        <button class="btn btn-outline" onclick="saveUserAnswers()">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            <span>Save Answers</span>
        </button>
    </div>

    <div class="main-workspace">
        
        <!-- Video Recording Studio -->
        <div class="video-panel">
            <div class="video-container">
                <div class="timer" id="timerDisplay">00:00</div>
                <video id="liveVideo" autoplay muted playsinline></video>
                <video id="playbackVideo" controls style="display:none;"></video>
            </div>
            
            <div class="cam-controls">
                <button class="btn btn-outline" style="color: white; border-color: rgba(255,255,255,0.2);" onclick="switchCamera()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                    <span>Camera</span>
                </button>
                <button class="btn btn-danger" id="btnRecord" onclick="toggleRecording()">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
                    <span>Start Record</span>
                </button>
                <button class="btn btn-outline" id="btnDownload" onclick="downloadVideo()" style="display:none; color: white; border-color: rgba(255,255,255,0.2);">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    <span>Download</span>
                </button>
            </div>
        </div>

        <!-- Question Preparation & Karaoke Pronunciation Testing -->
        <div class="q-panel">
            <div class="topic-selector-card">
                <label for="topicSelect">Select Practice Topic</label>
                <select id="topicSelect" class="select-field" onchange="renderCurrentTopic()">
                    <!-- Populated via JavaScript -->
                </select>
            </div>

            <div class="q-list" id="qListContainer">
                <!-- Question cards populated dynamically -->
            </div>
        </div>

    </div>

    <script>
        const TOPICS_DATA = [
            {
                id: "work_study",
                title: "1. Work or Studies",
                questions: [
                    "Do you work or are you a student?",
                    "What do you like most about your job or studies?",
                    "Why did you choose that particular field or major?",
                    "Is there anything you would like to change about your work or studies?"
                ]
            },
            {
                id: "hometown",
                title: "2. Hometown",
                questions: [
                    "Where is your hometown?",
                    "What do you like most about your hometown?",
                    "Is there anything you dislike about it?",
                    "Has your hometown changed much since you were a child?"
                ]
            },
            {
                id: "accommodation",
                title: "3. Accommodation & Living Space",
                questions: [
                    "Do you live in a house or an apartment?",
                    "What is your favorite room in your home, and why?",
                    "Would you like to move to a different home in the future?",
                    "How is the neighborhood around your living area?"
                ]
            },
            {
                id: "free_time",
                title: "4. Free Time & Hobbies",
                questions: [
                    "What do you usually do in your free time?",
                    "Did you have different hobbies when you were younger?",
                    "Do you prefer spending your free time alone or with other people?",
                    "Is there a new hobby you would like to try in the future?"
                ]
            },
            {
                id: "weather",
                title: "5. Weather & Seasons",
                questions: [
                    "What kind of weather do you like the most?",
                    "Does the weather affect your mood or daily routine?",
                    "Do you prefer rainy days or sunny days?",
                    "What is the climate like in your country?"
                ]
            },
            {
                id: "tech_social",
                title: "6. Technology & Social Media",
                questions: [
                    "How often do you use social media?",
                    "Do you think people spend too much time on their phones nowadays?",
                    "What kind of apps do you use most frequently?",
                    "Did you use the internet a lot when you were a child?"
                ]
            },
            {
                id: "food_cooking",
                title: "7. Food & Cooking",
                questions: [
                    "Do you like cooking? Why or why not?",
                    "What is your favorite type of food?",
                    "Do you prefer eating at home or eating at a restaurant?",
                    "Did you learn how to cook when you were young?"
                ]
            },
            {
                id: "daily_routine",
                title: "8. Daily Routine",
                questions: [
                    "What is the first thing you do when you wake up in the morning?",
                    "Are your mornings usually busy or relaxed?",
                    "Do you prefer getting up early or staying up late?",
                    "Has your daily routine changed much over the last few years?"
                ]
            }
        ];

        /* --- STATE MANAGEMENT --- */
        const STORAGE_KEY_ANSWERS = 'ielts_p1_saved_answers';
        let savedAnswers = JSON.parse(localStorage.getItem(STORAGE_KEY_ANSWERS) || '{}');
        let activeRecognition = null;
        let activeUniqueKey = null;
        let activeTtsKey = null;

        /* --- WEBRTC RECORDER --- */
        let mediaRecorder;
        let recordedChunks = [];
        let currentStream = null;
        let isRecording = false;
        let facingMode = "user";
        let videoBlob = null;
        let timerInterval;
        let secondsPassed = 0;

        async function initCamera() {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode },
                    audio: false
                });
                document.getElementById('liveVideo').srcObject = currentStream;
                document.getElementById('liveVideo').style.display = "block";
                document.getElementById('playbackVideo').style.display = "none";
                document.getElementById('btnDownload').style.display = "none";
            } catch (err) {
                console.warn('Camera preview notice:', err);
            }
        }

        function switchCamera() {
            facingMode = (facingMode === "user") ? "environment" : "user";
            initCamera();
        }

        function formatTime(sec) {
            let m = Math.floor(sec / 60).toString().padStart(2, '0');
            let s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        async function toggleRecording() {
            const btn = document.getElementById('btnRecord');
            const timerDisplay = document.getElementById('timerDisplay');
            
            if (!isRecording) {
                if (activeRecognition) activeRecognition.stop();
                stopNaturalReading();

                try {
                    const recordStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: facingMode },
                        audio: true
                    });
                    currentStream = recordStream;
                    document.getElementById('liveVideo').srcObject = recordStream;

                    recordedChunks = [];
                    mediaRecorder = new MediaRecorder(recordStream);
                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
                        const playback = document.getElementById('playbackVideo');
                        playback.src = URL.createObjectURL(videoBlob);
                        playback.style.display = "block";
                        document.getElementById('liveVideo').style.display = "none";
                        document.getElementById('btnDownload').style.display = "inline-flex";
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"></rect></svg><span>Stop Record</span>`;
                    btn.className = "btn btn-warning";

                    secondsPassed = 0;
                    timerDisplay.innerText = "00:00";
                    timerDisplay.classList.add('recording');
                    timerInterval = setInterval(() => {
                        secondsPassed++;
                        timerDisplay.innerText = formatTime(secondsPassed);
                    }, 1000);
                } catch (err) {
                    Swal.fire('Microphone Permission', 'Mohon izinkan akses mikrofon untuk merekam jawaban.', 'warning');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg><span>Record Again</span>`;
                btn.className = "btn btn-danger";

                clearInterval(timerInterval);
                timerDisplay.classList.remove('recording');

                initCamera();
            }
        }

        function downloadVideo() {
            if (!videoBlob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(videoBlob);
            a.download = `IELTS_Speaking_Part1_${Date.now()}.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        /* --- NATURAL HUMAN-LIKE VOICE SELECTION --- */
        let availableVoices = [];
        function loadVoices() {
            if ('speechSynthesis' in window) {
                availableVoices = window.speechSynthesis.getVoices();
            }
        }
        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function getBestNaturalVoice() {
            if (availableVoices.length === 0) loadVoices();
            
            const naturalVoice = availableVoices.find(v => 
                (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Online')) && 
                (v.lang.startsWith('en-GB') || v.lang.startsWith('en-US'))
            );
            if (naturalVoice) return naturalVoice;

            return availableVoices.find(v => v.lang.startsWith('en-GB') || v.lang.startsWith('en-US')) || null;
        }

        /* --- TOPIC & QUESTION RENDERING --- */
        function initTopics() {
            const select = document.getElementById('topicSelect');
            select.innerHTML = '';
            TOPICS_DATA.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.textContent = t.title;
                select.appendChild(opt);
            });

            const urlParams = new URLSearchParams(window.location.search);
            const topicParam = urlParams.get('topic');
            if (topicParam && TOPICS_DATA.some(t => t.id === topicParam)) {
                select.value = topicParam;
            }

            renderCurrentTopic();
        }

        function renderCurrentTopic() {
            stopNaturalReading();
            if (activeRecognition) activeRecognition.stop();

            const selectedId = document.getElementById('topicSelect').value;
            const topic = TOPICS_DATA.find(t => t.id === selectedId);
            const container = document.getElementById('qListContainer');
            container.innerHTML = '';

            savedAnswers = JSON.parse(localStorage.getItem(STORAGE_KEY_ANSWERS) || '{}');

            topic.questions.forEach((qText, idx) => {
                const uniqueKey = `${topic.id}_q${idx}`;
                const savedText = savedAnswers[uniqueKey] || "";

                const card = document.createElement('div');
                card.className = "q-card";
                card.id = `card_${uniqueKey}`;
                card.innerHTML = `
                    <div class="q-row">
                        <span class="q-title">${idx + 1}. ${qText}</span>
                        <div class="q-actions">
                            <button class="btn-icon btn-hint" title="Band 9 Hint & Analysis" onclick="openHint('${topic.id}', ${idx})">
                                <svg class="icon" viewBox="0 0 24 24"><line x1="9" y1="18" x2="15" y2="18"></line><line x1="10" y1="22" x2="14" y2="22"></line><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>
                            </button>
                            <button class="btn-icon" title="Listen to Question" onclick="speakQuestion('${qText.replace(/'/g, "\\'")}')">
                                <svg class="icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                            </button>
                        </div>
                    </div>

                    <div class="draft-container">
                        <textarea class="answer-draft" id="draft_${uniqueKey}" placeholder="Type your response draft here, or click Hint to use a Band 9 example..." oninput="autoSave('${uniqueKey}', this.value)">${savedText}</textarea>
                        
                        <div class="karaoke-display" id="karaoke_${uniqueKey}" title="Click background to edit draft text"></div>
                    </div>

                    <div class="practice-zone">
                        <div class="practice-actions">
                            <div class="action-buttons-group">
                                <button class="btn btn-outline" style="font-size:0.8rem; padding: 6px 12px;" id="btnMic_${uniqueKey}" onclick="testPronunciation('${uniqueKey}')">
                                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                                    <span>Check Pronunciation</span>
                                </button>
                                <button class="btn btn-outline" style="font-size:0.8rem; padding: 6px 12px;" id="btnTts_${uniqueKey}" onclick="toggleNaturalReading('${uniqueKey}')">
                                    <svg class="icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                                    <span>Human Guide</span>
                                </button>
                            </div>
                            <span class="accuracy-pill" id="score_${uniqueKey}" style="display:none;">Score: 0%</span>
                        </div>

                        <!-- Slider Kecepatan Membaca Alami (Speed Rate) -->
                        <div class="tts-speed-bar" id="ttsBar_${uniqueKey}">
                            <span>🎧 Reading Pace:</span>
                            <input type="range" id="speedSlider_${uniqueKey}" min="0.6" max="1.1" step="0.05" value="0.85" oninput="document.getElementById('speedVal_${uniqueKey}').innerText = this.value + 'x'">
                            <span class="speed-val-badge" id="speedVal_${uniqueKey}">0.85x</span>
                        </div>

                        <div class="speech-result" id="result_${uniqueKey}">Speak clearly into your mic, or click "Human Guide" to hear natural native pronunciation.</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openHint(topicId, questionIdx) {
            window.location.href = `Hint/index.html?topic=${encodeURIComponent(topicId)}&q=${encodeURIComponent(questionIdx)}`;
        }

        /* --- HUMAN-LIKE SPEECH SYNTHESIS --- */
        function speakQuestion(text) {
            if (!('speechSynthesis' in window)) return;
            stopNaturalReading();
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            const bestVoice = getBestNaturalVoice();
            if (bestVoice) utterance.voice = bestVoice;
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }

        function speakSingleWord(word) {
            if (!('speechSynthesis' in window)) return;
            stopNaturalReading();
            window.speechSynthesis.cancel();
            const clean = word.replace(/[^a-zA-Z0-9'-]/g, '');
            if (!clean) return;

            const utterance = new SpeechSynthesisUtterance(clean);
            const bestVoice = getBestNaturalVoice();
            if (bestVoice) utterance.voice = bestVoice;
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }

        /* --- PREPARE KARAOKE SPANS WITH WORD OFFSETS --- */
        let wordTokenMap = [];
        function prepareKaraokeDisplay(uniqueKey, targetText) {
            const karaokeEl = document.getElementById(`karaoke_${uniqueKey}`);
            karaokeEl.innerHTML = '';
            wordTokenMap = [];

            const regex = /\S+/g;
            let match;
            let lastIndex = 0;

            while ((match = regex.exec(targetText)) !== null) {
                if (match.index > lastIndex) {
                    const space = targetText.substring(lastIndex, match.index);
                    karaokeEl.appendChild(document.createTextNode(space));
                }

                const word = match[0];
                const span = document.createElement('span');
                span.className = 'karaoke-word';
                span.innerText = word;
                span.title = "Click to hear pronunciation";
                span.dataset.clean = word.toLowerCase().replace(/[^a-z0-9]/g, '');
                span.dataset.charIndex = match.index;

                span.onclick = (e) => {
                    e.stopPropagation();
                    speakSingleWord(word);
                };

                karaokeEl.appendChild(span);
                wordTokenMap.push({ charIndex: match.index, length: word.length, element: span });
                lastIndex = regex.lastIndex;
            }

            if (lastIndex < targetText.length) {
                karaokeEl.appendChild(document.createTextNode(targetText.substring(lastIndex)));
            }

            karaokeEl.onclick = () => {
                if (activeTtsKey || activeRecognition) return;
                karaokeEl.style.display = 'none';
                const draftEl = document.getElementById(`draft_${uniqueKey}`);
                draftEl.style.display = 'block';
                draftEl.focus();
            };
        }

        /* --- NATURAL READING MENGGUNAKAN EVENT ONBOUNDARY --- */
        function toggleNaturalReading(uniqueKey) {
            if (!('speechSynthesis' in window)) {
                Swal.fire('Not Supported', 'Text-to-Speech is not supported in this browser.', 'warning');
                return;
            }

            if (activeTtsKey === uniqueKey) {
                stopNaturalReading();
                return;
            }

            stopNaturalReading();
            if (activeRecognition) activeRecognition.stop();

            const draftEl = document.getElementById(`draft_${uniqueKey}`);
            const karaokeEl = document.getElementById(`karaoke_${uniqueKey}`);
            const resultBox = document.getElementById(`result_${uniqueKey}`);
            const targetText = draftEl.value.trim();

            if (!targetText) {
                Swal.fire('Draft is Empty', 'Please write or paste your response text first.', 'info');
                return;
            }

            prepareKaraokeDisplay(uniqueKey, targetText);
            draftEl.style.display = 'none';
            karaokeEl.style.display = 'block';

            const btnTts = document.getElementById(`btnTts_${uniqueKey}`);
            btnTts.className = 'btn btn-warning';
            btnTts.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"></rect></svg><span>Stop Reading</span>`;
            resultBox.innerHTML = '<span style="color: var(--warning); font-weight: 600;">🎧 Natural native pronunciation playing... Follow the rhythm!</span>';

            const speedSlider = document.getElementById(`speedSlider_${uniqueKey}`);
            const chosenRate = speedSlider ? parseFloat(speedSlider.value) : 0.85;

            const utterance = new SpeechSynthesisUtterance(targetText);
            const naturalVoice = getBestNaturalVoice();
            if (naturalVoice) utterance.voice = naturalVoice;
            utterance.rate = chosenRate;

            utterance.onboundary = (event) => {
                if (event.name === 'word') {
                    const charIdx = event.charIndex;
                    const matchedToken = wordTokenMap.find(item => 
                        charIdx >= item.charIndex && charIdx < (item.charIndex + item.length + 1)
                    );

                    if (matchedToken) {
                        karaokeEl.querySelectorAll('.karaoke-word').forEach(s => s.classList.remove('reading'));
                        matchedToken.element.classList.add('reading');
                        matchedToken.element.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }
            };

            utterance.onend = () => {
                stopNaturalReading();
                resultBox.innerHTML = '<span>✅ Audio guide completed! You can now test your own pronunciation.</span>';
            };

            utterance.onerror = () => stopNaturalReading();

            activeTtsKey = uniqueKey;
            window.speechSynthesis.speak(utterance);
        }

        function stopNaturalReading() {
            if (!activeTtsKey) return;
            const key = activeTtsKey;
            window.speechSynthesis.cancel();

            const btnTts = document.getElementById(`btnTts_${key}`);
            if (btnTts) {
                btnTts.className = 'btn btn-outline';
                btnTts.style.fontSize = '0.8rem';
                btnTts.style.padding = '6px 12px';
                btnTts.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg><span>Human Guide</span>`;
            }

            const karaokeEl = document.getElementById(`karaoke_${key}`);
            if (karaokeEl) {
                karaokeEl.querySelectorAll('.karaoke-word').forEach(s => s.classList.remove('reading'));
            }

            activeTtsKey = null;
        }

        /* --- SMART DE-DUPLICATOR (MENGATASI BUG KATA BERTUMPUK CHROME/ANDROID) --- */
        function getCleanTranscript(results) {
            let combined = "";

            for (let i = 0; i < results.length; i++) {
                const current = results[i][0].transcript.trim();
                if (!current) continue;

                if (!combined) {
                    combined = current;
                    continue;
                }

                const combLower = combined.toLowerCase();
                const currLower = current.toLowerCase();

                // 1. Android/Chrome Cumulative Bug: kalimat baru adalah versi lengkap dari sebelumnya
                if (currLower.startsWith(combLower)) {
                    combined = current;
                    continue;
                }

                // 2. Kalimat sudah ada di akhir rekaman
                if (combLower.endsWith(currLower)) {
                    continue;
                }

                // 3. Deteksi overlap kata (jika ada overlap 1 atau beberapa kata di sambungan jeda)
                const combWords = combined.split(/\s+/);
                const currWords = current.split(/\s+/);
                let overlapCount = 0;

                for (let k = 1; k <= Math.min(combWords.length, currWords.length); k++) {
                    const combSlice = combWords.slice(combWords.length - k).join(" ").toLowerCase();
                    const currSlice = currWords.slice(0, k).join(" ").toLowerCase();
                    if (combSlice === currSlice) {
                        overlapCount = k;
                    }
                }

                if (overlapCount > 0) {
                    const remainingWords = currWords.slice(overlapCount).join(" ");
                    if (remainingWords) combined += " " + remainingWords;
                } else {
                    combined += " " + current;
                }
            }

            return combined;
        }

        /* --- SPEECH RECOGNITION (DENGAN DE-DUPLIKASI DAN PERSISTENT WORD HIT) --- */
        function testPronunciation(uniqueKey) {
            stopNaturalReading();

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                Swal.fire({
                    title: 'Browser Not Supported',
                    html: 'Web Speech API memerlukan <b>Google Chrome</b> atau <b>Microsoft Edge</b>.<br><small>(Jika menggunakan Brave, aktifkan Google Services for Speech di pengaturan privasi).</small>',
                    icon: 'warning'
                });
                return;
            }

            const btn = document.getElementById(`btnMic_${uniqueKey}`);
            const draftEl = document.getElementById(`draft_${uniqueKey}`);
            const karaokeEl = document.getElementById(`karaoke_${uniqueKey}`);
            const resultBox = document.getElementById(`result_${uniqueKey}`);
            const scorePill = document.getElementById(`score_${uniqueKey}`);
            const targetText = draftEl.value.trim();

            if (!targetText) {
                Swal.fire('Draft is Empty', 'Please write or paste your response text first, or import one from the Band 9 Hint.', 'info');
                return;
            }

            if (activeRecognition) {
                activeRecognition.stop();
                return;
            }

            prepareKaraokeDisplay(uniqueKey, targetText);
            draftEl.style.display = 'none';
            karaokeEl.style.display = 'block';

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = true;
            recognition.continuous = true;
            recognition.maxAlternatives = 3;

            recognition.onstart = () => {
                activeRecognition = recognition;
                activeUniqueKey = uniqueKey;
                btn.className = 'btn btn-danger';
                btn.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"></rect></svg><span>Stop & Done</span>`;
                resultBox.innerHTML = '<span style="color: var(--primary); font-weight: 600;">● Listening live... Speak out loud clearly!</span>';
                scorePill.style.display = 'inline-block';
                scorePill.innerText = 'Listening...';
            };

            recognition.onresult = (event) => {
                // Bersihkan transkrip dari duplikasi akumulatif Chrome/Android
                const cleanSentence = getCleanTranscript(event.results);

                // Buat daftar token kata dari hasil bersih
                let matchTokens = cleanSentence.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);

                // Tambahkan alternatif kata dari hasil terbaru untuk toleransi aksen
                const latestResult = event.results[event.results.length - 1];
                if (latestResult) {
                    for (let j = 0; j < latestResult.length; j++) {
                        const altWords = latestResult[j].transcript.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);
                        altWords.forEach(w => {
                            if (!matchTokens.includes(w)) matchTokens.push(w);
                        });
                    }
                }

                // Update highlight kata (kata yang sudah hit akan tetap tersimpan)
                updateKaraokeHighlights(karaokeEl, matchTokens, scorePill);
                resultBox.innerHTML = `<strong>Heard:</strong> "${cleanSentence}"`;
            };

            recognition.onerror = (e) => {
                if (e.error === 'not-allowed') {
                    Swal.fire('Microphone Blocked', 'Izin mikrofon ditolak oleh browser. Klik ikon gembok di URL bar Vercel dan izinkan Microphone.', 'error');
                } else if (e.error !== 'no-speech') {
                    resultBox.innerText = `Microphone notice: ${e.error}`;
                }
            };

            recognition.onend = () => {
                activeRecognition = null;
                activeUniqueKey = null;
                btn.className = 'btn btn-outline';
                btn.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg><span>Check Pronunciation</span>`;
                resultBox.innerHTML += ' <span style="color:#64748b;">(Click background to edit draft text)</span>';
            };

            try {
                recognition.start();
            } catch (err) {
                console.error("Speech recognition start error:", err);
            }
        }

        // Persistent Matcher: Kata yang sudah berhasil diucapkan TETAP BIRU (.hit)
        function updateKaraokeHighlights(karaokeContainer, spokenTokenArray, scoreBadge) {
            const wordElements = karaokeContainer.querySelectorAll('.karaoke-word');
            
            let matchCount = 0;
            let totalWords = 0;

            wordElements.forEach(span => {
                const cleanWord = span.dataset.clean;
                if (!cleanWord) return;
                totalWords++;

                // Jika kata sudah pernah cocok sebelumnya ATAU ada di rekaman suara saat ini
                if (span.classList.contains('hit') || spokenTokenArray.includes(cleanWord)) {
                    span.classList.add('hit');
                    matchCount++;
                }
            });

            if (totalWords > 0) {
                const score = Math.round((matchCount / totalWords) * 100);
                scoreBadge.innerText = `Score: ${score}%`;
                scoreBadge.style.background = score >= 80 ? '#ecfdf5' : '#eff6ff';
                scoreBadge.style.color = score >= 80 ? '#047857' : '#1d4ed8';
                scoreBadge.style.borderColor = score >= 80 ? '#a7f3d0' : '#bfdbfe';
            }
        }

        /* --- STORAGE LOGIC --- */
        function autoSave(key, text) {
            savedAnswers[key] = text;
        }

        function saveUserAnswers() {
            localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify(savedAnswers));
            Swal.fire({
                icon: 'success',
                title: 'Saved',
                text: 'Your drafted answers are stored locally!',
                timer: 1500,
                showConfirmButton: false
            });
        }

        window.onload = () => {
            initCamera();
            initTopics();
        };
    </script>
