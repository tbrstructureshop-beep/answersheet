<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IELTS Listening Practice Pro V4</title>
    
    <!-- Simple-Keyboard CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/css/index.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --correct-bg: #dcfce7;
            --incorrect-bg: #fee2e2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        html, body {
            height: 100%; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column;
        }

        .container { max-width: 800px; margin: 0 auto; padding: 0 20px; }

        /* --- STICKY TOP ZONE --- */
        .sticky-zone {
            flex-shrink: 0; background-color: var(--bg-color); padding-top: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); z-index: 100;
        }

        header h1 { text-align: center; font-size: 1.5rem; margin-bottom: 15px; }
        .top-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 15px; }

        /* --- SCROLLABLE WORKSPACE --- */
        .main-scroll-area {
            flex-grow: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: 20px; padding-bottom: 280px; /* Ruang extra u/ keyboard */
        }

        /* --- Media Player --- */
        .media-setup { background: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        @media (min-width: 600px) { .media-setup { flex-direction: row; } }
        .input-group { display: flex; flex: 1; gap: 8px; }
        input[type="text"], input[type="file"], select { padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 16px; }
        
        button { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 500; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
        button:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-danger { background: transparent; border: 1px solid #ef4444; color: #ef4444; }
        .btn-success { background: #10b981; }
        .btn-print { background: #4f46e5; }
        .btn-warning { background: #f59e0b; color: white; }

        .video-wrapper { position: relative; background: #000; border-radius: 8px; display: none; overflow: hidden; margin-bottom: 10px; }
        .video-wrapper.is-video { padding-bottom: 56.25%; height: 0; }
        .video-wrapper.is-video iframe, .video-wrapper.is-video video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .video-wrapper.is-audio { background: var(--card-bg); padding: 15px; }
        .video-wrapper.is-audio audio { width: 100%; outline: none; }

        .score-banner { display: none; background: #10b981; color: white; text-align: center; padding: 10px; font-weight: bold; border-radius: 8px; }

        /* --- Workspace --- */
        .section-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: var(--card-bg); padding: 10px 15px; border-radius: 8px; }
        .sec-indicator { font-weight: bold; color: var(--primary); }
        
        .section-card { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; border-left: 5px solid var(--primary); display: none; }
        .section-card.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
        .section-title { font-size: 1.25rem; font-weight: bold; border: none; border-bottom: 2px dashed var(--border); padding: 4px; flex: 1; background: transparent; min-width: 100px; }
        .time-mark { width: 70px; text-align: center; }

        .answers-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
        .answer-row { display: flex; flex-direction: column; gap: 10px; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
        .answer-row[data-correct="true"] { background-color: var(--correct-bg); border-color: #86efac; }
        .answer-row[data-correct="false"] { background-color: var(--incorrect-bg); border-color: #fca5a5; }

        .answer-main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .answer-num { font-weight: bold; color: var(--primary); min-width: 25px; text-align: right; }
        
        .q-type { padding: 6px; font-size: 14px; cursor: pointer; }
        .dynamic-ui { flex: 1; display: flex; gap: 8px; align-items: center; min-width: 200px; }
        .mcq-choice { padding: 6px; font-weight: bold; }

        .target-input { border: none; background: transparent; border-bottom: 1px solid var(--border); padding: 6px; font-size: 16px; flex: 1; width: 100%; cursor: text; }
        .target-input.boxed { border: 1px dashed var(--text-muted); background: white; border-radius: 6px; }
        .input-active { border-bottom: 2px solid var(--primary) !important; background-color: #eff6ff !important; border-radius: 4px; outline: none; }
        .target-input.boxed.input-active { border: 2px solid var(--primary) !important; }

        .correction-ui { display: none; flex-direction: column; gap: 8px; width: 100%; margin-top: 5px; padding-top: 10px; border-top: 1px dashed #cbd5e1; }
        .correction-tools { display: flex; gap: 8px; align-items: center; }
        .btn-icon { padding: 6px; border-radius: 50%; background: transparent; border: 1px solid var(--border); display: flex; align-items: center; cursor: pointer; }
        .btn-icon svg { width: 20px; height: 20px; }
        .btn-icon.check:hover { background: #dcfce7; border-color: #22c55e; color: #16a34a; }
        .btn-icon.cross:hover { background: #fee2e2; border-color: #ef4444; color: #dc2626; }
        .cor-dynamic { flex: 1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        .global-actions { text-align: center; margin-bottom: 50px; }

        /* --- SIMPLE-KEYBOARD WRAPPER --- */
        #keyboard-wrapper {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #e2e8f0; 
            box-shadow: 0 -4px 15px rgba(0,0,0,0.15); z-index: 1000;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #keyboard-wrapper.show { transform: translateY(0); }
        .kb-toolbar { display: flex; justify-content: space-between; padding: 8px 10px; background: #cbd5e1; border-bottom: 1px solid #94a3b8; }
        
        .hg-theme-default { font-family: inherit; padding: 10px; background: #e2e8f0; }
        .hg-button { font-size: 16px !important; }

        /* --- PRINT STYLES --- */
        @media print {
            html, body { height: auto !important; overflow: visible !important; display: block !important; }
            .main-scroll-area { height: auto !important; overflow: visible !important; display: block !important; padding: 0 !important; }
            .sticky-zone, .section-nav-bar, .global-actions, button, #keyboard-wrapper { display: none !important; }
            .section-card { display: block !important; box-shadow: none; border: none; border-bottom: 2px solid #000; margin-bottom: 10px; }
            .answer-row { background: transparent !important; border: none !important; padding: 5px 0; }
            .target-input { border-bottom: 1px solid #000 !important; color: black; }
            .q-type, .mcq-choice { border: none; appearance: none; }
        }
    </style>
</head>
<body>

<div class="sticky-zone">
    <div class="container">
        <header><h1>IELTS Listening Pro V4</h1></header>
        <div class="top-actions">
            <button class="btn-success" onclick="saveData(true)">💾 Simpan</button>
            <button class="btn-warning" onclick="toggleCorrectionMode()" id="btn-correction">✅ Mode Koreksi</button>
            <button class="btn-print" onclick="window.print()">🖨️ Print</button>
            <button class="btn-outline" onclick="toggleKeyboardMode()" id="btn-kb-mode">⌨️ Virtual KB: ON</button>
        </div>
        <div class="media-setup" id="media-setup-box">
            <div class="input-group">
                <input type="text" id="yt-link" placeholder="Link YouTube...">
                <button onclick="loadYouTube()">Load YT</button>
            </div>
            <div class="input-group">
                <input type="file" id="local-file" accept="video/mp4,audio/*,video/*">
                <button onclick="loadLocalFile()">Load File</button>
            </div>
        </div>
        <div class="video-wrapper" id="video-wrapper"></div>
        <div class="score-banner" id="score-banner">Skor: 0 / 0</div>
    </div>
</div>

<div class="main-scroll-area">
    <div class="container" id="workspace-container">
        <div class="section-nav-bar">
            <button id="btn-prev-sec" onclick="navigateSection(-1)">⬅️ Prev</button>
            <span class="sec-indicator" id="sec-indicator">Part 1 dari 1</span>
            <button id="btn-next-sec" onclick="navigateSection(1)">Next ➡️</button>
        </div>
        <div id="workspace"></div>
        <div class="global-actions">
            <button onclick="addSection()">+ Tambah Part Baru</button>
        </div>
    </div>
</div>

<!-- SIMPLE KEYBOARD WRAPPER -->
<div id="keyboard-wrapper">
    <div class="kb-toolbar">
        <button class="btn-success" onclick="applyProperCase()" style="padding: 4px 12px;">Aa Proper Case</button>
        <button class="btn-primary" onclick="hideKeyboard()" style="padding: 4px 12px; background: var(--text-main);">Tutup ⬇</button>
    </div>
    <div class="simple-keyboard"></div>
</div>

<!-- Script Simple-Keyboard -->
<script src="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/index.js"></script>

<script>
    let sectionCount = 0;
    let currentSectionIndex = 0;
    let isCorrectionMode = false;
    let useCustomKB = true; // Default ON memblokir keyboard HP
    
    let activeInputTarget = null;
    let keyboard; // Instance simple-keyboard
    const LOCAL_STORAGE_KEY = 'ielts_listening_pro_v4';

    // --- INISIALISASI SIMPLE-KEYBOARD ---
    function initKeyboard() {
        const Keyboard = window.SimpleKeyboard.default;
        keyboard = new Keyboard({
            onChange: input => {
                if (activeInputTarget) {
                    activeInputTarget.value = input;
                    saveData();
                }
            },
            onKeyPress: button => {
                if (button === "{shift}" || button === "{lock}") {
                    let currentLayout = keyboard.options.layoutName;
                    keyboard.setOptions({ layoutName: currentLayout === "default" ? "shift" : "default" });
                }
                if (button === "{enter}") hideKeyboard();
            },
            layout: {
                'default': [
                    '1 2 3 4 5 6 7 8 9 0 - {bksp}',
                    'q w e r t y u i o p /',
                    'a s d f g h j k l ; {enter}',
                    '{shift} z x c v b n m , . ?',
                    '{space}'
                ],
                'shift': [
                    '! @ # $ % ^ & * ( ) _ {bksp}',
                    'Q W E R T Y U I O P /',
                    'A S D F G H J K L : {enter}',
                    '{shift} Z X C V B N M < > ?',
                    '{space}'
                ]
            },
            display: {
                '{bksp}': '⌫', '{enter}': 'Done', '{shift}': '⇧', '{space}': 'Spasi'
            }
        });
    }

    // --- FUNGSI KEYBOARD CUSTOM ---
    function showKeyboard(inputElem) {
        if(!useCustomKB) return;
        activeInputTarget = inputElem;
        document.querySelectorAll('.target-input').forEach(el => el.classList.remove('input-active'));
        inputElem.classList.add('input-active');
        keyboard.setInput(inputElem.value);
        document.getElementById('keyboard-wrapper').classList.add('show');
    }

    function hideKeyboard() {
        document.getElementById('keyboard-wrapper').classList.remove('show');
        if(activeInputTarget) activeInputTarget.classList.remove('input-active');
        activeInputTarget = null;
    }

    function toggleKeyboardMode() {
        useCustomKB = !useCustomKB;
        document.getElementById('btn-kb-mode').innerText = useCustomKB ? "⌨️ Virtual KB: ON" : "⌨️ Virtual KB: OFF";
        hideKeyboard(); applyInputProtection();
    }

    function applyInputProtection() {
        document.querySelectorAll('.target-input').forEach(input => { input.readOnly = useCustomKB; });
    }

    function applyProperCase() {
        if(!activeInputTarget) return;
        let val = activeInputTarget.value;
        let proper = val.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
        activeInputTarget.value = proper;
        keyboard.setInput(proper);
        saveData();
    }

    document.addEventListener('click', (e) => {
        if(e.target.classList.contains('target-input')) { showKeyboard(e.target); } 
        else if(!e.target.closest('#keyboard-wrapper') && !e.target.classList.contains('target-input') && !e.target.classList.contains('hg-button')) {
            hideKeyboard();
        }
    });


    // --- FUNGSI MEDIA PLAYER & TIMESTAMP ---
    function loadYouTube() {
        const url = document.getElementById('yt-link').value;
        const videoId = extractYouTubeID(url);
        if (!videoId) return alert("Link YouTube tidak valid!");
        
        // PENTING: Tambahkan ?enablejsapi=1 agar bisa dilompat (seek)
        const wrapper = document.getElementById('video-wrapper');
        wrapper.style.display = 'block'; wrapper.className = 'video-wrapper is-video';
        wrapper.innerHTML = `<iframe id="yt-player" src="https://www.youtube.com/embed/${videoId}?enablejsapi=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        document.getElementById('media-setup-box').style.display = 'none'; 
    }

    function extractYouTubeID(url) {
        const regex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
        return url.match(regex)?.[1] || null;
    }

    function loadLocalFile() {
        const file = document.getElementById('local-file').files[0];
        if (!file) return alert("Pilih file video/audio!");
        const wrapper = document.getElementById('video-wrapper');
        wrapper.style.display = 'block';
        if(file.type.startsWith('audio/')) {
            wrapper.className = 'video-wrapper is-audio'; wrapper.innerHTML = `<audio controls id="local-player" src="${URL.createObjectURL(file)}"></audio>`;
        } else {
            wrapper.className = 'video-wrapper is-video'; wrapper.innerHTML = `<video controls id="local-player" src="${URL.createObjectURL(file)}"></video>`;
        }
        document.getElementById('media-setup-box').style.display = 'none';
    }

    // Melompat ke Time Mark tertentu
    function jumpToTime(btn) {
        const timeInput = btn.previousElementSibling.value;
        if(!timeInput) return alert("Isi Time Mark dulu! (misal: 03:15)");
        
        let parts = timeInput.split(':');
        let totalSeconds = 0;
        if(parts.length === 2) totalSeconds = (parseInt(parts[0]) * 60) + parseInt(parts[1]);
        else if(parts.length === 3) totalSeconds = (parseInt(parts[0]) * 3600) + (parseInt(parts[1]) * 60) + parseInt(parts[2]);
        else return alert("Format waktu salah! Gunakan MM:SS");

        const ytIframe = document.getElementById('yt-player');
        const localPlayer = document.getElementById('local-player');

        if(ytIframe) {
            // PostMessage API untuk YouTube Iframe
            ytIframe.contentWindow.postMessage(JSON.stringify({
                "event": "command", "func": "seekTo", "args": [totalSeconds, true]
            }), "*");
            ytIframe.contentWindow.postMessage(JSON.stringify({
                "event": "command", "func": "playVideo", "args": []
            }), "*");
        } else if(localPlayer) {
            localPlayer.currentTime = totalSeconds;
            localPlayer.play();
        } else {
            alert("Muat video/audio terlebih dahulu!");
        }
    }


    // --- FUNGSI WORKSPACE & JAWABAN ---
    function addSection(data = null, skipSave = false) {
        sectionCount++;
        const title = data ? data.title : `Part ${sectionCount}`;
        const timeMark = data ? data.timeMark : ``;

        const workspace = document.getElementById('workspace');
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'section-card';
        
        sectionDiv.innerHTML = `
            <div class="section-header">
                <input type="text" class="section-title target-input" value="${title}" oninput="saveData()">
                <div style="display:flex; align-items:center; gap:5px; background:#f1f5f9; padding:4px 8px; border-radius:6px;">
                    <input type="text" class="time-mark target-input" value="${timeMark}" placeholder="MM:SS" oninput="saveData()">
                    <button class="btn-primary" onclick="jumpToTime(this)" style="padding:4px 8px;">⏱️ Go</button>
                </div>
                <div>
                    <button class="btn-outline" onclick="toggleCollapse(this)">🔽 Hide</button>
                    <button class="btn-danger" onclick="removeSection(this)">🗑️</button>
                </div>
            </div>
            <div class="answers-container"></div>
            <button class="btn-outline" onclick="addAnswer(this)">+ Tambah Jawaban</button>
        `;
        workspace.appendChild(sectionDiv);
        
        if(!skipSave) {
            addAnswer(sectionDiv.querySelector('.btn-outline'));
            currentSectionIndex = document.querySelectorAll('.section-card').length - 1;
            updateSectionNav();
            applyInputProtection(); 
        }
    }

    function toggleCollapse(btn) {
        const container = btn.closest('.section-card').querySelector('.answers-container');
        if (container.style.display === 'none') { container.style.display = 'flex'; btn.innerHTML = '🔽 Hide'; } 
        else { container.style.display = 'none'; btn.innerHTML = '▶️ Expand'; }
    }

    function removeSection(btn) {
        if(confirm("Hapus Part ini beserta jawabannya?")) {
            btn.closest('.section-card').remove();
            if(currentSectionIndex > 0) currentSectionIndex--;
            updateGlobalNumbering(); updateSectionNav(); saveData();
        }
    }

    function addAnswer(btn, answerData = null) {
        const d = answerData || { type: "essay", text: "", correct: "null", reason: "", choice: "A", choiceText: "", correctChoice: "A", correctChoiceText: "", mcqReason: "" };
        const container = btn.closest('.section-card').querySelector('.answers-container');
        const row = document.createElement('div');
        row.className = 'answer-row'; row.dataset.correct = d.correct;
        
        const svgCheck = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;
        const svgCross = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>`;
        const opts = ['A','B','C','D','E','F'];

        row.innerHTML = `
            <div class="answer-main">
                <span class="answer-num"></span>
                <select class="q-type" onchange="toggleQType(this); saveData();">
                    <option value="essay" ${d.type === 'essay' ? 'selected' : ''}>Essay</option>
                    <option value="mcq" ${d.type === 'mcq' ? 'selected' : ''}>PilGan</option>
                </select>

                <!-- UI Latihan (Dynamic) -->
                <div class="dynamic-ui">
                    <input type="text" class="ans-essay target-input" value="${d.text}" placeholder="Jawaban..." oninput="saveData()">
                    <select class="ans-mcq-choice mcq-item" onchange="saveData()" style="display:none;">
                        ${opts.map(c => `<option value="${c}" ${d.choice===c?'selected':''}>${c}</option>`).join('')}
                    </select>
                    <input type="text" class="ans-mcq-text target-input mcq-item" value="${d.choiceText}" placeholder="Deskripsi opsi..." style="display:none;" oninput="saveData()">
                </div>
                <button class="btn-danger" onclick="removeAnswer(this)">X</button>
            </div>

            <div class="correction-ui" style="display: ${isCorrectionMode ? 'flex' : 'none'};">
                <div style="display:flex; gap:8px; width:100%; align-items:center;">
                    <div class="correction-tools">
                        <button class="btn-icon check" onclick="markCorrect(this, 'true')">${svgCheck}</button>
                        <button class="btn-icon cross" onclick="markCorrect(this, 'false')">${svgCross}</button>
                    </div>

                    <!-- UI Koreksi (Dynamic) -->
                    <div class="cor-dynamic">
                        <input type="text" class="cor-essay target-input boxed" value="${d.reason}" placeholder="Alasan Jawaban Essay..." oninput="saveData()">
                        
                        <select class="cor-mcq-choice mcq-item" onchange="saveData()" style="display:none;">
                            ${opts.map(c => `<option value="${c}" ${d.correctChoice===c?'selected':''}>Kunci: ${c}</option>`).join('')}
                        </select>
                        <input type="text" class="cor-mcq-text target-input boxed mcq-item" value="${d.correctChoiceText}" placeholder="Deskripsi kunci..." style="display:none;" oninput="saveData()">
                        <input type="text" class="cor-mcq-reason target-input boxed mcq-item" value="${d.mcqReason}" placeholder="Reason..." style="display:none;" oninput="saveData()">
                    </div>
                </div>
            </div>
        `;
        container.appendChild(row);
        toggleQType(row.querySelector('.q-type')); // Set view awal berdasarkan load data
        applyInputProtection();
        updateGlobalNumbering(); calculateScore(); saveData();
    }

    function toggleQType(selectElem) {
        const row = selectElem.closest('.answer-row');
        const type = selectElem.value;
        const essayItems = row.querySelectorAll('.ans-essay, .cor-essay');
        const mcqItems = row.querySelectorAll('.mcq-item');

        if (type === 'essay') {
            essayItems.forEach(el => el.style.display = 'block');
            mcqItems.forEach(el => el.style.display = 'none');
        } else {
            essayItems.forEach(el => el.style.display = 'none');
            mcqItems.forEach(el => el.style.display = 'inline-block'); // inline block untuk flex items
        }
    }

    function removeAnswer(btn) { btn.closest('.answer-row').remove(); updateGlobalNumbering(); calculateScore(); saveData(); }
    function updateGlobalNumbering() { document.querySelectorAll('.answer-row').forEach((row, i) => { row.querySelector('.answer-num').textContent = (i + 1) + "."; }); }

    function updateSectionNav() {
        const sections = document.querySelectorAll('.section-card');
        if (!sections.length) return;
        sections.forEach((sec, i) => { sec.classList.remove('active'); if (i === currentSectionIndex) sec.classList.add('active'); });
        document.getElementById('btn-prev-sec').disabled = (currentSectionIndex === 0);
        document.getElementById('btn-next-sec').disabled = (currentSectionIndex === sections.length - 1);
        document.getElementById('sec-indicator').textContent = `Part ${currentSectionIndex + 1} dari ${sections.length}`;
    }
    function navigateSection(dir) {
        const len = document.querySelectorAll('.section-card').length;
        currentSectionIndex = Math.max(0, Math.min(len - 1, currentSectionIndex + dir));
        updateSectionNav();
    }

    // --- MODE KOREKSI ---
    function toggleCorrectionMode() {
        isCorrectionMode = !isCorrectionMode;
        const btn = document.getElementById('btn-correction');
        if (isCorrectionMode) { btn.innerHTML = "✍️ Kembali Latihan"; btn.className = "btn-outline"; document.getElementById('score-banner').style.display = "block"; } 
        else { btn.innerHTML = "✅ Mode Koreksi"; btn.className = "btn-warning"; document.getElementById('score-banner').style.display = "none"; }
        document.querySelectorAll('.correction-ui').forEach(ui => ui.style.display = isCorrectionMode ? 'flex' : 'none');
        calculateScore();
    }

    function markCorrect(btn, status) { btn.closest('.answer-row').dataset.correct = status; calculateScore(); saveData(); }
    
    function calculateScore() {
        const rows = document.querySelectorAll('.answer-row');
        let correctCount = 0; rows.forEach(row => { if (row.dataset.correct === 'true') correctCount++; });
        document.getElementById('score-banner').textContent = `Skor Terkini: ${correctCount} / ${rows.length}`;
    }

    // --- DATA MANAGEMENT ---
    function saveData(showAlert = false) {
        const data = [];
        document.querySelectorAll('.section-card').forEach(sec => {
            const answers = [];
            sec.querySelectorAll('.answer-row').forEach(row => {
                answers.push({
                    type: row.querySelector('.q-type').value,
                    correct: row.dataset.correct,
                    text: row.querySelector('.ans-essay').value,
                    reason: row.querySelector('.cor-essay').value,
                    choice: row.querySelector('.ans-mcq-choice').value,
                    choiceText: row.querySelector('.ans-mcq-text').value,
                    correctChoice: row.querySelector('.cor-mcq-choice').value,
                    correctChoiceText: row.querySelector('.cor-mcq-text').value,
                    mcqReason: row.querySelector('.cor-mcq-reason').value
                });
            });
            data.push({ 
                title: sec.querySelector('.section-title').value, 
                timeMark: sec.querySelector('.time-mark').value,
                answers: answers 
            });
        });
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
        if (showAlert) alert("Progress disimpan!");
    }

    function loadData() {
        initKeyboard(); // Inisiasi Simple Keyboard Dulu

        const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (saved) {
            const data = JSON.parse(saved);
            if(data.length > 0) {
                document.getElementById('workspace').innerHTML = ''; sectionCount = 0;
                data.forEach(secData => {
                    addSection(secData, true);
                    const lastSec = document.querySelectorAll('.section-card')[document.querySelectorAll('.section-card').length - 1];
                    secData.answers.forEach(ans => addAnswer(lastSec.querySelector('.btn-outline'), ans));
                });
                currentSectionIndex = 0; updateSectionNav(); calculateScore(); applyInputProtection();
                return;
            }
        }
        addSection(); 
    }

    window.onload = loadData;
</script>
</body>
</html>
